name: Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gateway
            context: backend
            file: backend/Dockerfile
            build-args: MODULE=gateway:infrastructure
          - image: simulator
            context: backend
            file: backend/Dockerfile
            build-args: MODULE=simulator:infrastructure
          - image: validator
            context: backend
            file: backend/validator-web/Dockerfile
            build-contexts: conformance=conformance
          - image: console
            context: frontend
            file: frontend/Dockerfile
            target: console
          - image: simulator-ui
            context: frontend
            file: frontend/Dockerfile
            target: simulator
          - image: validator-ui
            context: frontend
            file: frontend/Dockerfile
            target: validator
          - image: shop
            context: frontend
            file: frontend/Dockerfile
            target: shop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build-args }}
          build-contexts: ${{ matrix.build-contexts }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  notes:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          version="${TAG#v}"
          {
            gh release view "$TAG" --repo "$REPO" --json body --jq .body
            printf '\n## Images\n\n'
            for image in gateway simulator validator console simulator-ui validator-ui shop; do
              printf -- "- \`ghcr.io/%s/%s:%s\`\n" "$OWNER" "$image" "$version"
            done
          } > notes.md
          gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
