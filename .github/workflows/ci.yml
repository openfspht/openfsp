name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uvx --from actionlint-py==1.7.12.25 actionlint

  gradle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew build

  conformance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: openfsp
          POSTGRES_USER: openfsp
          POSTGRES_PASSWORD: openfsp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openfsp"
          --health-interval 2s
          --health-retries 30
    env:
      OPENFSP_BOOTSTRAP_KEY: ofsp_test_DemoShopKeyPublishedForTheSimulator01
      OPENFSP_API_KEY: ofsp_test_DemoShopKeyPublishedForTheSimulator01
      OPENFSP_DERIVATION_KEY: ZGV2ZWxvcG1lbnQtb25seS1kZXJpdmF0aW9uLWtleS0wMQ==
      OPENFSP_ADMIN_TOKEN: $argon2id$v=19$m=65536,t=3,p=4$PEua5g9jsR2Ot2g7bhkBWT4vxejdDAl8jlbiptXsNzI$ZlQNIj02jEudsOtGDc/XRMcHIW2jOfSAzq/68WI+x5c
      VALIDATE_ADMIN_TOKEN: demo-admin-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew :simulator:infrastructure:bootJar :gateway:infrastructure:bootJar :validator:cliJar
        working-directory: backend
      - run: |
          nohup java -jar backend/simulator/infrastructure/build/libs/app.jar > simulator.log 2>&1 &
          nohup java -jar backend/gateway/infrastructure/build/libs/app.jar > gateway.log 2>&1 &
          for port in 8090 8080; do
            timeout 180 sh -c "until curl -fs http://127.0.0.1:$port/actuator/health > /dev/null; do sleep 2; done"
          done
      - run: |
          session=$(curl -fsS -o /dev/null -D - -H 'Content-Type: application/json' -d "{\"token\":\"$VALIDATE_ADMIN_TOKEN\"}" \
            http://127.0.0.1:8080/admin/session | sed -n 's/^[Ss]et-[Cc]ookie: *\(openfsp_admin=[^;]*\).*/\1/p')
          restricted=$(curl -fsS -H "Cookie: $session" -H 'Content-Type: application/json' \
            -d '{"principal":"conformance-restricted","scopes":["payments:read","payments:write"]}' \
            http://127.0.0.1:8080/admin/keys | jq -r .secret)
          test -n "$restricted"
          echo "::add-mask::$restricted"
          java -jar backend/validator/build/libs/openfsp-validate.jar \
            --base-url http://127.0.0.1:8080 \
            --simulator-url http://127.0.0.1:8090 \
            --conformance conformance \
            --report conformance-report.json \
            --input "restricted-key=$restricted"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-report
          path: |
            conformance-report.json
            simulator.log
            gateway.log
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
