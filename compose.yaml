x-gateway-url: &gateway-url http://gateway.127.0.0.1.sslip.io
x-simulator-url: &simulator-url http://simulator.127.0.0.1.sslip.io
x-validator-url: &validator-url http://validator.127.0.0.1.sslip.io

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: openfsp
      POSTGRES_USER: openfsp
      POSTGRES_PASSWORD: openfsp
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "openfsp"]
      interval: 2s
      retries: 30

  simulator:
    profiles: [demo]
    build:
      context: backend
      args:
        MODULE: simulator:infrastructure
        PORT: "8090"
        UI: simulator
      additional_contexts:
        sdk: ./sdks/kotlin
        frontend: ./frontend
    environment:
      OPENFSP_SIMULATOR_URL: *simulator-url
      OPENFSP_GATEWAY_URL: *gateway-url
      OPENFSP_SIMULATOR_HTTP_CALLBACK_HOSTS: gateway.127.0.0.1.sslip.io,validator.127.0.0.1.sslip.io
    depends_on:
      traefik:
        condition: service_healthy

  gateway:
    profiles: [demo]
    build:
      context: backend
      args:
        MODULE: gateway:infrastructure
        PORT: "8080"
        UI: console
      additional_contexts:
        sdk: ./sdks/kotlin
        frontend: ./frontend
    environment:
      SPRING_PROFILES_ACTIVE: development,simulated,demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/openfsp
      SPRING_DATASOURCE_USERNAME: openfsp
      SPRING_DATASOURCE_PASSWORD: openfsp
      OPENFSP_APP_KEY: ${OPENFSP_APP_KEY:?run make keys}
      OPENFSP_ADMIN_HOST: console.127.0.0.1.sslip.io
      OPENFSP_PUBLIC_BASE_URL: *gateway-url
      OPENFSP_SIMULATOR_URL: *simulator-url
    depends_on:
      traefik:
        condition: service_healthy
      postgres:
        condition: service_healthy
      simulator:
        condition: service_healthy

  validator:
    profiles: [demo]
    build:
      context: backend
      args:
        MODULE: validator:infrastructure
        PORT: "8095"
        UI: validator
      additional_contexts:
        conformance: ./conformance
        sdk: ./sdks/kotlin
        frontend: ./frontend
    environment:
      SPRING_PROFILES_ACTIVE: development
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/openfsp
      SPRING_DATASOURCE_USERNAME: openfsp
      SPRING_DATASOURCE_PASSWORD: openfsp
      OPENFSP_VALIDATOR_PUBLIC_URL: *validator-url
    depends_on:
      traefik:
        condition: service_healthy
      postgres:
        condition: service_healthy


  traefik:
    profiles: [demo]
    image: traefik:v3.7.19
    command:
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/dynamic.yaml
      - --ping
      - --log.level=WARN
    configs:
      - source: traefik
        target: /etc/traefik/dynamic.yaml
    ports:
      - "127.0.0.1:80:80"
    networks:
      default:
        aliases:
          - console.127.0.0.1.sslip.io
          - gateway.127.0.0.1.sslip.io
          - simulator.127.0.0.1.sslip.io
          - validator.127.0.0.1.sslip.io
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 2s
      retries: 30

configs:
  traefik:
    content: |
      http:
        routers:
          gateway:
            rule: Host(`gateway.127.0.0.1.sslip.io`) || Host(`console.127.0.0.1.sslip.io`)
            service: gateway
          simulator:
            rule: Host(`simulator.127.0.0.1.sslip.io`)
            service: simulator
          validator:
            rule: Host(`validator.127.0.0.1.sslip.io`)
            service: validator
        services:
          gateway:
            loadBalancer:
              servers:
                - url: http://gateway:8080
          simulator:
            loadBalancer:
              servers:
                - url: http://simulator:8090
          validator:
            loadBalancer:
              servers:
                - url: http://validator:8095

volumes:
  postgres:
