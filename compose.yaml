x-demo-key: &demo-key ofsp_test_DemoShopKeyPublishedForTheSimulator01

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: openfsp
      POSTGRES_USER: openfsp
      POSTGRES_PASSWORD: openfsp
    ports:
      - "5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "openfsp"]
      interval: 2s
      retries: 30

  simulator:
    profiles: [demo]
    build:
      context: backend
      args:
        MODULE: simulator:infrastructure
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8090 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  gateway:
    profiles: [demo]
    build:
      context: backend
      args:
        MODULE: gateway:infrastructure
    environment:
      SPRING_PROFILES_ACTIVE: development,docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/openfsp
      SPRING_DATASOURCE_USERNAME: openfsp
      SPRING_DATASOURCE_PASSWORD: openfsp
      OPENFSP_ADMIN_TOKEN: '$$argon2id$$v=19$$m=65536,t=3,p=4$$PEua5g9jsR2Ot2g7bhkBWT4vxejdDAl8jlbiptXsNzI$$ZlQNIj02jEudsOtGDc/XRMcHIW2jOfSAzq/68WI+x5c'
      OPENFSP_BOOTSTRAP_KEY: *demo-key
      OPENFSP_CONFORMANCE_ENABLED: "true"
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      simulator:
        condition: service_healthy

  console:
    profiles: [demo]
    build:
      context: frontend
      target: console
    ports:
      - "5173:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on: [gateway]

  simulator-ui:
    profiles: [demo]
    build:
      context: frontend
      target: simulator
    ports:
      - "5175:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on: [simulator]

  validator:
    profiles: [demo]
    build:
      context: backend
      args:
        MODULE: validator:infrastructure
      additional_contexts:
        conformance: ./conformance
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/openfsp
      SPRING_DATASOURCE_USERNAME: openfsp
      SPRING_DATASOURCE_PASSWORD: openfsp
      OPENFSP_VALIDATOR_DEVELOPMENT_MODE: "true"
      OPENFSP_VALIDATOR_BEHIND_TRUSTED_PROXY: "true"
      OPENFSP_VALIDATOR_SIMULATOR_DERIVATION_KEY: ZGV2ZWxvcG1lbnQtb25seS1kZXJpdmF0aW9uLWtleS0wMQ==
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8095 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      simulator:
        condition: service_healthy

  validator-ui:
    profiles: [demo]
    build:
      context: frontend
      target: validator
    ports:
      - "5176:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on: [validator]

  shop:
    profiles: [demo]
    image: ghcr.io/openfspht/demo:latest
    environment:
      OPENFSP_BASE_URL: http://gateway:8080
      OPENFSP_ALLOW_PLAIN_HTTP: "true"
      OPENFSP_API_KEY: *demo-key
      SHOP_WEBHOOK_URL: http://shop:3000/webhooks/openfsp
      SHOP_PUBLIC_URL: http://localhost:3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://127.0.0.1:3000/health')).ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on: [gateway]
