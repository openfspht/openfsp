x-demo-key: &demo-key ofsp_test_DemoShopKeyPublishedForTheSimulator01

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: openfsp
      POSTGRES_USER: openfsp
      POSTGRES_PASSWORD: openfsp
    ports:
      - "5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "openfsp"]
      interval: 2s
      retries: 30

  simulator:
    profiles: [demo]
    build:
      context: backend
      args:
        MODULE: simulator:infrastructure
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "127.0.0.1:8090:8090"

  gateway:
    profiles: [demo]
    build:
      context: backend
      args:
        MODULE: gateway:infrastructure
    environment:
      SPRING_PROFILES_ACTIVE: development,docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/openfsp
      SPRING_DATASOURCE_USERNAME: openfsp
      SPRING_DATASOURCE_PASSWORD: openfsp
      OPENFSP_ADMIN_TOKEN: '$$argon2id$$v=19$$m=65536,t=3,p=4$$PEua5g9jsR2Ot2g7bhkBWT4vxejdDAl8jlbiptXsNzI$$ZlQNIj02jEudsOtGDc/XRMcHIW2jOfSAzq/68WI+x5c'
      OPENFSP_BOOTSTRAP_KEY: *demo-key
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      simulator:
        condition: service_started

  console:
    profiles: [demo]
    build:
      context: frontend
      target: console
    ports:
      - "5173:8080"
    depends_on: [gateway]

  simulator-ui:
    profiles: [demo]
    build:
      context: frontend
      target: simulator
    ports:
      - "5175:8080"
    depends_on: [simulator]

  validator:
    profiles: [demo]
    build:
      context: backend
      args:
        MODULE: validator:infrastructure
      additional_contexts:
        conformance: ./conformance
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/openfsp
      SPRING_DATASOURCE_USERNAME: openfsp
      SPRING_DATASOURCE_PASSWORD: openfsp
      OPENFSP_VALIDATOR_DEVELOPMENT_MODE: "true"
      OPENFSP_VALIDATOR_BEHIND_TRUSTED_PROXY: "true"
      OPENFSP_VALIDATOR_SIMULATOR_DERIVATION_KEY: ZGV2ZWxvcG1lbnQtb25seS1kZXJpdmF0aW9uLWtleS0wMQ==
    depends_on:
      postgres:
        condition: service_healthy
      simulator:
        condition: service_started

  validator-ui:
    profiles: [demo]
    build:
      context: frontend
      target: validator
    ports:
      - "5176:8080"
    depends_on: [validator]

  shop:
    profiles: [demo]
    image: ghcr.io/openfspht/demo-shop:latest
    environment:
      OPENFSP_BASE_URL: http://gateway:8080
      OPENFSP_ALLOW_PLAIN_HTTP: "true"
      OPENFSP_API_KEY: *demo-key
      SHOP_WEBHOOK_URL: http://shop:3000/webhooks/openfsp
      SHOP_PUBLIC_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on: [gateway]
