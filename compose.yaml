x-demo-key: &demo-key ofsp_test_DemoShopKeyPublishedForTheSimulator01
x-simulator-key: &simulator-key ofsp_test_MockOpenFspKeyPublishedForTheSimulator

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: openfsp
      POSTGRES_USER: openfsp
      POSTGRES_PASSWORD: openfsp
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "openfsp"]
      interval: 2s
      retries: 30

  simulator:
    profiles: [demo]
    build:
      context: backend
      args:
        MODULE: simulator:infrastructure
        PORT: "8090"
        UI: simulator
      additional_contexts:
        sdk: ./sdks/kotlin
        frontend: ./frontend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SIMULATOR_CONTROL_KEY: *simulator-key
    ports:
      - "127.0.0.1:8090:8090"

  gateway:
    profiles: [demo]
    build:
      context: backend
      args:
        MODULE: gateway:infrastructure
        PORT: "8080"
        UI: console
      additional_contexts:
        sdk: ./sdks/kotlin
        frontend: ./frontend
    environment:
      SPRING_PROFILES_ACTIVE: development,docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/openfsp
      SPRING_DATASOURCE_USERNAME: openfsp
      SPRING_DATASOURCE_PASSWORD: openfsp
      OPENFSP_ADMIN_TOKEN: '$$argon2id$$v=19$$m=65536,t=3,p=4$$PEua5g9jsR2Ot2g7bhkBWT4vxejdDAl8jlbiptXsNzI$$ZlQNIj02jEudsOtGDc/XRMcHIW2jOfSAzq/68WI+x5c'
      OPENFSP_BOOTSTRAP_KEY: *demo-key
      OPENFSP_APP_KEY: ${OPENFSP_APP_KEY:?run make keys}
      OPENFSP_ADMIN_HOST: console.localhost
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      simulator:
        condition: service_healthy

  validator:
    profiles: [demo]
    build:
      context: backend
      args:
        MODULE: validator:infrastructure
        PORT: "8095"
        UI: validator
      additional_contexts:
        conformance: ./conformance
        sdk: ./sdks/kotlin
        frontend: ./frontend
    environment:
      SPRING_PROFILES_ACTIVE: development,docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/openfsp
      SPRING_DATASOURCE_USERNAME: openfsp
      SPRING_DATASOURCE_PASSWORD: openfsp
    ports:
      - "127.0.0.1:8095:8095"
    depends_on:
      postgres:
        condition: service_healthy

  shop:
    profiles: [demo]
    image: ghcr.io/openfspht/demo:latest
    environment:
      OPENFSP_BASE_URL: http://gateway:8080
      OPENFSP_ALLOW_PLAIN_HTTP: "true"
      OPENFSP_API_KEY: *demo-key
      SHOP_WEBHOOK_URL: http://shop:3000/webhooks/openfsp
      SHOP_PUBLIC_URL: http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [gateway]

volumes:
  postgres:
