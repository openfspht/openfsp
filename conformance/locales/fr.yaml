limits:
  conformance#8.1: Un rapport de conformité n'est pas un audit de sécurité.
  conformance#6.3: Un résultat obtenu contre le serveur simulé ne vaut que pour la configuration qui l'a produit et ne dit rien d'un fournisseur réel.

requirements:
  AUTH-3.3: Une requête sans clé est refusée comme non authentifiée, avec un défi Bearer
  AUTH-4.7: Une clé absente, malformée ou inconnue produit le même problème de non-authentification
  AUTH-6.4: Une clé sans la portée requise est refusée comme interdite
  API-1.4: Les succès sont en application/json et les erreurs en application/problem+json
  API-1.8: Chaque réponse porte Request-Id, égal au request_id du problème
  API-1.12: Une collection est un objet contenant un tableau data
  API-3.1: Un paiement créé porte les membres obligatoires de Payment
  API-5.1: Une création sans champ obligatoire est refusée avec missing-field
  API-5.2.1: La lecture par identifiant renvoie le paiement, ou not-found pour un identifiant inconnu
  API-5.2.2: La lecture par référence renvoie au plus un paiement, et un data vide pour une référence inconnue
  API-5.2.4: Une lecture qui n'établit aucun nouvel état répond 200 avec le paiement inchangé
  API-5.2.5: La lecture d'un paiement terminal le renvoie tel qu'enregistré
  API-10.1.1: Toute erreur est un problem detail
  API-10.1.5: Le membre status du problème est égal au statut HTTP
  API-10.7.1: Les erreurs de champ désignent un JSON Pointer et un code de la liste fermée
  API-10.7.3: Chaque erreur de champ désigne la requête telle qu'envoyée par le client
  MDD-2.4: Une requête avec un membre inconnu est refusée en 400, qui nomme ce membre
  MDD-2.7: Un montant envoyé comme chaîne est refusé avec invalid-field
  MDD-3.3: Un montant avec une partie décimale ou un exposant est refusé
  MDD-3.6: Un montant nul ou négatif est refusé avec invalid-field
  MDD-4.1: Une devise autre que HTG est refusée avec invalid-field
  IDEM-1.3: Une création sans Idempotency-Key est refusée sans être exécutée
  IDEM-3.2: Une relecture renvoie le statut et le corps enregistrés avec Idempotent-Replay, sans seconde exécution
  IDEM-3.3: La même clé avec un autre corps est refusée avec idempotency-key-reused
  IDEM-6.2: Une référence déjà utilisée est refusée avec reference-conflict sous une autre clé
  CAP-2.2: Aucun nom de capacité réservé n'est annoncé
  CAP-3.1: Le document de configuration est servi sans authentification
  CAP-3.2: Les capacités sont authentifiées et décrivent chaque fournisseur
  CAP-3.2.5: webhooks.emit figure pour chaque fournisseur dont le serveur émet les événements
  CAP-5.2: Avec payments.lookup, la lecture d'un paiement en attente établit son état chez le fournisseur
  AUTH-7.3: Une clé révoquée est refusée comme non authentifiée, sans qu'on puisse la distinguer d'une clé absente
  AUTH-7.6: Une clé expirée est refusée comme non authentifiée, sans qu'on puisse la distinguer d'une clé absente
  API-1.9: Un membre inconnu imbriqué dans un objet de la requête est refusé
  API-10.1.3: Chaque problème porte ses membres obligatoires avec les valeurs du catalogue
  API-10.1.6: Les erreurs du serveur, 5xx compris, portent request_id
  API-10.8.6: Une erreur du fournisseur donne provider-error, réessayable avec un effet inconnu, jamais rejouée
  MDD-2.1: Les corps de requête et de réponse sont du JSON en UTF-8
  MDD-3.2: Un montant est un nombre entier de centimes
  MDD-7.1: Les horodatages sont des date-times RFC 3339 en UTC avec un Z majuscule
  CDV-2.1: Les transitions depuis pending sont atteignables
  CDV-4: Un paiement expiré chez le fournisseur est expired, avec completed_at, à la lecture
  CDV-6.1: L'API ne peut pas fixer l'état d'un paiement
  CDV-7.2: Un paiement échoué porte un failure_reason de la liste fermée, conforme au refus du fournisseur
  CDV-7.4: failure_detail porte le code et le message du fournisseur sans les altérer
  CDV-10.2.1: Un paiement réussi figure dans le relevé de sa journée comptable, avec son identifiant et sa référence
  CDV-10.2.3: Un paiement qui n'a pas réussi ne figure pas dans le relevé
  CDV-10.2.4: Une entrée du relevé porte les frais déclarés par le fournisseur pour ce paiement, et aucun quand ils sont inconnus
  CDV-10.3.2: Un relevé se lit pour une journée comptable ou un intervalle bornes comprises, et une requête sans période valide est refusée
  CDV-10.3.3: Un intervalle de plus de 31 journées comptables est refusé avec invalid-field
  CAP-4.4: Un membre dont le fournisseur n'annonce pas la capacité est refusé avec capability-not-supported et ne crée rien
  CDV-10.3.6: Sans payments.statement, le relevé est refusé avec capability-not-supported
  IDEM-2.3: Une réponse enregistrée n'est jamais servie à un autre principal
  IDEM-3.4: Un doublon concurrent n'est jamais exécuté en parallèle
  CAP-5.3: Sans payments.lookup, la lecture d'un paiement en attente renvoie l'état connu du serveur
  CAP-6.7: Les bornes de montant déclarées sont appliquées sans créer de paiement
  CAP-6.7.1: Un montant nul est refusé avec invalid-field avant la vérification des bornes déclarées
  MDD-8.1: Des frais déclarés portent un montant en HTG et un payeur, merchant ou payer
  MDD-8.3: Un client ne peut pas fixer les frais ni qui les paie à la création
  WH-1.4: Aucun événement n'est émis pour un état que le paiement n'a pas atteint
  WH-2.1: Chaque livraison est un objet événement avec ses membres obligatoires et un instantané complet du paiement
  WH-3.2: Chaque transition émet son type enregistré avec previous_status
  WH-3.4: Un rapport du fournisseur ou une lecture qui ne change aucun état n'émet aucun événement
  WH-4.2: Une livraison est un POST JSON portant Content-Digest, l'identifiant et le type de l'événement et le rang de la tentative
  WH-4.4: Un 410 Gone arrête les nouvelles tentatives de l'événement
  WH-4.5: Une réponse de plus de 10 secondes est un échec et la livraison est retentée
  WH-4.6: Une redirection est un échec, n'est pas suivie, et la livraison est retentée
  WH-4.7: Une livraison échouée est retentée pas avant le calendrier prévu, avec le même identifiant d'événement et un corps identique à l'octet près
  WH-4.8: Les livraisons en échec d'un paiement ne retiennent pas celles d'un autre
  WH-5.3: Chaque livraison est signée sur les composants listés avec les paramètres obligatoires et se vérifie avec une clé publiée
  WH-6.1: Les clés de vérification sont publiées en JWK, dans webhook_keys du seul document de configuration non authentifié
  WH-8.1: Les événements d'un paiement portent les séquences 1 puis 2, dans l'ordre, jamais réutilisées
  API-5.1.8: Les événements d'un paiement sont livrés à son callback_url, signés selon les webhooks, et un callback_url en http simple est refusé

scenarios:
  authentication/expired-key:
    title: Une clé expirée est non authentifiée, avec le titre d'une clé absente et aucun détail distinctif
    action: Émettez une clé de l'environnement cible déjà expirée et passez-la avec --input expired-key=CLÉ. Contre mock_openfsp, passez sa clé expirée publiée.
  authentication/indistinguishable-refusals:
    title: Une clé absente, malformée ou inconnue donne unauthenticated avec le même titre et aucun détail distinctif
  authentication/missing-key:
    title: Une requête sans Authorization ou avec un autre schéma est non authentifiée, avec WWW-Authenticate Bearer
  authentication/missing-scope:
    title: Une clé sans statements:read est interdite sur les relevés, jamais unauthenticated ni not-found
    action: Émettez une clé de l'environnement cible sans la portée statements:read et passez-la avec --input restricted-key=CLÉ.
  authentication/revoked-key:
    title: Une clé révoquée est non authentifiée, avec le titre d'une clé absente et aucun détail distinctif
    action: Émettez une clé de l'environnement cible, révoquez-la, attendez le temps pendant lequel le serveur peut garder en cache une décision d'authentification, puis passez-la avec --input revoked-key=CLÉ. Contre mock_openfsp, passez sa clé révoquée publiée.
  capabilities/amount-bounds:
    title: Les montants aux bornes déclarées sont créés ; ceux qui sortent d'un centime ou du pas sont refusés avec amount-out-of-range, sans créer de paiement
    action: Déclarez min_amount, max_amount et amount_step pour un fournisseur dans la configuration du serveur et passez son identifiant avec --input bounded-provider=ID.
  capabilities/callback-url-without-capability:
    title: Une création portant callback_url chez un fournisseur qui n'annonce pas webhooks.per_payment_url est refusée avec capability-not-supported et ne crée rien
  capabilities/capabilities:
    title: Les capacités exigent une clé et décrivent chaque fournisseur avec payments et un objet payments complet
  capabilities/discovery:
    title: Le document de configuration est servi sans clé et indique la version du protocole, l'émetteur et les capacités prises en charge
  capabilities/emit-per-provider:
    title: Un serveur qui émet des événements liste webhooks.emit pour le fournisseur et parmi les capacités qu'il prend en charge
  capabilities/read-without-lookup:
    title: La lecture d'un paiement en attente sans payments.lookup répond 200 avec l'état connu du serveur
  capabilities/reserved-names:
    title: Ni les capacités ni le document de configuration n'annoncent de nom de capacité réservé
  capabilities/zero-amount-bounds:
    title: Un montant nul est refusé avec invalid-field et le code not_positive avant la vérification des bornes déclarées
    action: Déclarez min_amount, max_amount et amount_step pour un fournisseur dans la configuration du serveur et passez son identifiant avec --input bounded-provider=ID.
  errors/field-errors:
    title: Un problème invalid-field liste des erreurs avec un champ JSON Pointer et un code de la liste fermée
  errors/field-pointers:
    title: Chaque erreur de champ pointe dans le corps de la requête tel que le client l'a envoyé
  errors/media-types:
    title: Une création réussie est en application/json et une création refusée en application/problem+json
  errors/problem-members:
    title: Chaque problème porte ses membres obligatoires avec le status, retryable et effect de son entrée du catalogue
  errors/problem-shape:
    title: Les erreurs d'authentification, de validation, de conflit et de recherche sont des problem details en application/problem+json
  errors/request-id-on-operator-errors:
    title: Une erreur causée par le fournisseur porte request_id, égal à l'en-tête Request-Id
  errors/request-id:
    title: Les succès et les erreurs portent Request-Id, égal à request_id en cas d'erreur
  errors/status-member:
    title: Le membre status d'un problème est égal au statut HTTP pour 400, 401, 404, 409 et 422
  failures/decline:
    title: Un refus du fournisseur donne un paiement failed en 200, avec failure_reason declined et le code et le message du fournisseur dans failure_detail
  failures/expire:
    title: Un paiement reste pending jusqu'à ce que le fournisseur le déclare expiré, puis il est expired, avec completed_at et sans failure_reason, à la lecture
  failures/insufficient-funds:
    title: Des fonds insuffisants chez le fournisseur donnent un paiement failed en 200 avec failure_reason insufficient_funds
  failures/provider-error:
    title: Une erreur du fournisseur à la création donne 502 provider-error, réessayable avec un effet inconnu, et n'est pas rejouée à un renvoi
  idempotency/concurrent:
    title: Deux créations concurrentes sous la même clé ne s'exécutent jamais en parallèle ; la seconde attend ou est refusée avec idempotency-request-in-progress et Retry-After, et un renvoi rejoue la réponse enregistrée
  idempotency/duplicate-reference:
    title: Une référence déjà utilisée est refusée avec reference-conflict sous une autre clé, avec un seul paiement sous cette référence
  idempotency/key-reused:
    title: La même clé avec un autre corps est refusée avec idempotency-key-reused et n'est pas exécutée
  idempotency/missing-key:
    title: Une création sans Idempotency-Key est refusée avec idempotency-key-required et ne crée rien
  idempotency/principal:
    title: Une réponse enregistrée n'est jamais rejouée pour un autre principal qui utilise la même clé et le même corps
    action: Émettez une clé de l'environnement cible pour un autre principal, avec les portées payments:read et payments:write, et passez-la avec --input restricted-key=CLÉ. Contre mock_openfsp, passez sa clé publiée du second principal.
  idempotency/replay:
    title: La même clé et le même corps rejouent le statut et le corps enregistrés, avec Idempotent-Replay true et un seul paiement sous la référence
  lifecycle/state-from-the-api:
    title: Les requêtes de l'API qui tentent de fixer l'état d'un paiement en attente le laissent pending
  lifecycle/transitions:
    title: Un paiement en attente passe à succeeded sur une capture confirmée et à failed sur un refus, à la lecture
  payments/centimes:
    title: Un montant en centimes est créé et relu comme le même entier
  payments/client-fee:
    title: Une création qui fixe les frais et leur payeur est refusée et ne crée rien
  payments/collection:
    title: Une recherche par référence répond par un objet contenant un tableau data, jamais par un tableau nu
  payments/create:
    title: Une création valide répond 201 avec Location et un paiement pending portant tous les membres obligatoires
  payments/currency:
    title: Une devise autre que HTG est refusée avec invalid-field sur /amount/currency
  payments/integer-amount:
    title: Un montant avec une partie décimale ou un exposant est refusé avec invalid-field
  payments/missing-field:
    title: Une création sans reference, amount ou provider est refusée avec missing-field
  payments/nested-unknown-field:
    title: Un membre inconnu imbriqué dans un objet connu de la requête est refusé en 400 avec unknown-field, qui le nomme
  payments/positive-amount:
    title: Un montant nul ou négatif est refusé avec invalid-field et le code not_positive
  payments/read-by-id:
    title: La lecture par identifiant renvoie le paiement créé, et un identifiant inconnu donne 404 not-found
  payments/read-by-reference:
    title: La lecture par référence donne un paiement pour une référence connue et un data vide pour une référence inconnue
  payments/read-lookup:
    title: Un paiement réglé sans rappel atteint, à la lecture, l'état rapporté par la consultation du fournisseur
  payments/read-terminal:
    title: La lecture d'un paiement terminal répond 200 avec le paiement tel qu'enregistré
  payments/read-unchanged:
    title: Une lecture qui n'établit aucun nouvel état répond 200 avec le paiement inchangé
  payments/reported-fee:
    title: Un paiement réussi chez un fournisseur qui déclare des frais porte des frais en HTG payés par le marchand ou le payeur
  payments/string-amount:
    title: Un montant envoyé comme chaîne JSON est refusé avec invalid-field sur /amount/amount
  payments/timestamps:
    title: Chaque horodatage d'un paiement, en attente puis terminal, est un date-time RFC 3339 en UTC avec un Z majuscule
  payments/unknown-field:
    title: Une création avec un membre inconnu est refusée en 400 avec unknown-field, qui nomme ce membre
  payments/utf-8:
    title: Un corps JSON UTF-8 avec des caractères non ASCII est accepté et relu inchangé comme JSON
  statements/entry-with-fee:
    title: L'entrée du relevé d'un paiement réussi chez un fournisseur qui déclare des frais porte les frais de ce paiement
    action: Émettez une clé de l'environnement cible avec la portée statements:read et passez-la avec --input statements-key=CLÉ.
  statements/entry-without-fees:
    title: L'entrée du relevé d'un paiement dont le fournisseur ne déclare pas de frais ne porte aucuns frais
    action: Émettez une clé de l'environnement cible avec la portée statements:read et passez-la avec --input statements-key=CLÉ.
  statements/missing-period:
    title: Une demande de relevé sans période est refusée avec missing-field, toute autre combinaison avec invalid-field
    action: Émettez une clé de l'environnement cible avec la portée statements:read et passez-la avec --input statements-key=CLÉ.
  statements/range-too-long:
    title: Un intervalle de 31 journées comptables est servi, un intervalle plus long est refusé avec invalid-field
    action: Émettez une clé de l'environnement cible avec la portée statements:read et passez-la avec --input statements-key=CLÉ.
  statements/range:
    title: Un intervalle ne renvoie que les entrées de ses journées, bornes comprises
    action: Émettez une clé de l'environnement cible avec la portée statements:read et passez-la avec --input statements-key=CLÉ.
  statements/successful-payment:
    title: Un paiement réussi figure dans le relevé de sa journée comptable avec son identifiant et sa référence
    action: Émettez une clé de l'environnement cible avec la portée statements:read et passez-la avec --input statements-key=CLÉ.
  statements/unsuccessful-payment:
    title: Un paiement qui n'a pas réussi ne figure pas dans le relevé
    action: Émettez une clé de l'environnement cible avec la portée statements:read et passez-la avec --input statements-key=CLÉ.
  statements/without-capability:
    title: Le relevé d'un fournisseur qui n'annonce pas payments.statement est refusé avec capability-not-supported
    action: Émettez une clé de l'environnement cible avec la portée statements:read et passez-la avec --input statements-key=CLÉ.
  webhooks/callback-url-http:
    title: Une création dont le callback_url est en http simple vers un hôte autre que la boucle locale est refusée avec invalid-field sur /callback_url et ne crée rien
  webhooks/callback-url:
    title: Un paiement créé avec un callback_url y reçoit son événement terminal, en POST JSON signé qui se vérifie avec une clé du document de configuration
  webhooks/event-members:
    title: Un paiement qui réussit est livré en payment.created puis payment.succeeded, chacun étant un objet événement qui porte la référence et un instantané complet du paiement
  webhooks/expired-event:
    title: Un paiement expiré par le fournisseur est livré en payment.expired avec previous_status pending
  webhooks/failed-event:
    title: Un paiement refusé est livré en payment.failed avec previous_status pending et sa raison d'échec
  webhooks/headers:
    title: Une livraison est un POST JSON dont OpenFSP-Event-Id et OpenFSP-Event-Type reprennent le corps, avec Content-Digest et la tentative 1
  webhooks/independent-payments:
    title: Pendant que la livraison d'un paiement attend sa nouvelle tentative, l'événement d'un autre paiement est livré
  webhooks/keys:
    title: Le document de configuration non authentifié publie les clés de webhook en JWK publiques avec leur statut, et aucun autre point d'accès ne les sert
  webhooks/no-event-read:
    title: La lecture d'un paiement qui reste en attente n'émet rien au-delà de payment.created
  webhooks/no-event-refused-creation:
    title: Une création refusée faute de montant n'émet aucun événement, alors qu'une création acceptée émet payment.created
  webhooks/redirect:
    title: Une livraison qui reçoit un 302 ne suit pas Location et est retentée
  webhooks/retry-same-body:
    title: Une livraison qui reçoit un 500 est retentée après au moins 30 secondes, comme tentative 2 du même événement, identique à l'octet près et signée à nouveau
  webhooks/sequence:
    title: La création et la réussite d'un paiement sont ses événements 1 et 2, livrés une fois chacun
  webhooks/signature:
    title: Une livraison est signée sous sig1 sur les six composants listés, avec created, expires, keyid, nonce, alg ed25519 et tag openfsp-webhook, et se vérifie avec une clé publiée
  webhooks/slow-response:
    title: Une livraison qui reçoit sa réponse après 11 secondes est un échec et est retentée
  webhooks/stop-on-gone:
    title: Une livraison qui reçoit 410 Gone n'est pas retentée
