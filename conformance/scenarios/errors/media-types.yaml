requirement: API-1.4
title: A successful creation is application/json and a refused one application/problem+json
provider: mock_openfsp
steps:
  - name: success
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
      media-type: application/json
  - name: read
    request:
      method: GET
      path: /v1/payments?reference={{reference}}
    expect:
      status: 200
      media-type: application/json
  - name: error
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key:error}}"
      body:
        reference: "{{reference:error}}"
        amount:
          amount: 0
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 422
      media-type: application/problem+json
