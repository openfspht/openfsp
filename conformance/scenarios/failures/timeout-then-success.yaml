requirement: API-5.1.6
title: A creation without answer that succeeded at the operator gives 504 provider-timeout with effect unknown, one creation at the operator after a resend, and succeeded after synchronization
provider: mock_openfsp
steps:
  - name: declare TIMEOUT_THEN_SUCCESS under the derived order id
    simulator:
      declare:
        operator: "{{provider}}"
        order: "{{order}}"
        scenario: TIMEOUT_THEN_SUCCESS
  - name: create
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 504
      media-type: application/problem+json
      schema: problem
      equals:
        /type: https://openfsp.org/problems/provider-timeout
        /retryable: true
        /effect: unknown
  - name: resend with the same key
    request:
      same-as: create
  - name: read by reference
    request:
      method: GET
      path: /v1/payments?reference={{reference}}
    expect:
      status: 200
      present:
        - /data/0/id
    capture:
      payment_id: /data/0/id
  - name: the operator records the creation once its answer is held back
    journal:
      operator: "{{provider}}"
      method: POST
      path: ^/{{provider}}/v1/payments$
      contains: "{{order}}"
      at-least: 1
      within: 60s
      every: 2s
  - name: one creation at the operator
    journal:
      operator: "{{provider}}"
      method: POST
      path: ^/{{provider}}/v1/payments$
      contains: "{{order}}"
      count: 1
  - name: synchronize
    await:
      request:
        method: POST
        path: /v1/payments/{{payment_id}}/synchronize
      until:
        status: 200
        equals:
          /status: succeeded
      within: 30s
      every: 2s
    expect:
      schema: payment
