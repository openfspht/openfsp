requirement: CDV-6.3.2
title: A success reported for another amount leaves the payment pending, never succeeded
provider: mock_openfsp
steps:
  - name: declare AMOUNT_MISMATCH under the derived order id
    simulator:
      declare:
        operator: "{{provider}}"
        order: "{{order}}"
        scenario: AMOUNT_MISMATCH
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: the operator reports the success of another amount
    simulator:
      settled:
        operator: "{{provider}}"
        order: "{{order}}"
  - name: synchronize against the mismatched amount
    request:
      method: POST
      path: /v1/payments/{{payment_id}}/synchronize
    expect:
      any-of:
        - status: 200
          equals:
            /status: pending
        - media-type: application/problem+json
  - name: read
    request:
      method: GET
      path: /v1/payments/{{payment_id}}
    expect:
      status: 200
      schema: payment
      equals:
        /status: pending
        /amount/amount: 125000
