requirement: CDV-4
title: A payment is pending until the provider reports it expired, then expired with completed_at and no failure_reason on read
steps:
  - name: declare PENDING_FOREVER under the reference
    control:
      declare:
        reference: "{{reference}}"
        scenario: PENDING_FOREVER
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: pending until the provider reports otherwise
    request:
      method: GET
      path: /v1/payments/{{payment_id}}
    expect:
      status: 200
      equals:
        /status: pending
      absent:
        - /completed_at
  - name: the provider reports the payment expired
    control:
      resolve:
        reference: "{{reference}}"
        outcome: expired
  - name: expired on read
    await:
      request:
        method: GET
        path: /v1/payments/{{payment_id}}
      until:
        status: 200
        equals:
          /status: expired
      within: 20s
      every: 2s
    expect:
      schema: payment
      present:
        - /completed_at
      absent:
        - /failure_reason
