requirement: API-10.9.6
title: An operator error at creation gives 502 provider-error, retryable with effect unknown, relays the operator code and message, and is not replayed on a resend
provider: mock_openfsp
steps:
  - name: declare PROVIDER_ERROR under the derived order id
    simulator:
      declare:
        operator: "{{provider}}"
        order: "{{order}}"
        scenario: PROVIDER_ERROR
  - name: create
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 502
      media-type: application/problem+json
      schema: problem
      equals:
        /type: https://openfsp.org/problems/provider-error
        /retryable: true
        /effect: unknown
  - name: read the operator error
    setup: true
    journal:
      operator: "{{provider}}"
      contains: "{{order}}"
      method: POST
      path: ^/{{provider}}/v1/payments$
      at-least: 1
      capture:
        operator_detail: /response_body/detail
  - name: the relayed error is the operator code and message
    request:
      same-as: create
    expect:
      headers-absent:
        - Idempotent-Replay
      any-of:
        - absent:
            - /provider_detail
        - present:
            - /provider_detail/code
          equals:
            /provider_detail/message: "{{operator_detail}}"
