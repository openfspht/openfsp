requirement: API-10.8.6
title: A provider error at creation gives 502 provider-error, retryable with effect unknown, and is not replayed on a resend
steps:
  - name: declare PROVIDER_ERROR under the reference
    control:
      declare:
        reference: "{{reference}}"
        scenario: PROVIDER_ERROR
  - name: create
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 502
      media-type: application/problem+json
      schema: problem
      equals:
        /type: https://openfsp.org/problems/provider-error
        /retryable: true
        /effect: unknown
  - name: the resend is not replayed
    request:
      same-as: create
    expect:
      headers-absent:
        - Idempotent-Replay
