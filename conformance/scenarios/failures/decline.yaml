requirement: CDV-7.4
title: A refusal by the provider gives a failed payment in 200 with failure_reason declined and the provider code and message unaltered in failure_detail
variables:
  provider_code: DECLINED
  provider_message: The payment was declined
with-capabilities:
  - payments.lookup
steps:
  - name: declare DECLINE under the reference
    simulator:
      declare:
        provider: "{{provider}}"
        reference: "{{reference}}"
        scenario: DECLINE
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: the provider refuses the payment
    simulator:
      settled:
        provider: "{{provider}}"
        reference: "{{reference}}"
  - name: synchronize
    await:
      request:
        method: POST
        path: /v1/payments/{{payment_id}}/synchronize
      until:
        status: 200
        equals:
          /status: failed
      within: 20s
      every: 2s
    expect:
      media-type: application/json
      schema: payment
      equals:
        /failure_reason: declined
        /failure_detail/code: "{{provider_code}}"
        /failure_detail/message: "{{provider_message}}"
