requirement: CDV-7.4
title: A refusal by the provider gives a failed payment in 200 with failure_reason declined and the provider code and message in failure_detail
steps:
  - name: declare PENDING_FOREVER under the reference
    control:
      declare:
        reference: "{{reference}}"
        scenario: PENDING_FOREVER
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: the provider refuses the payment
    control:
      resolve:
        reference: "{{reference}}"
        outcome: failed
        reason: declined
  - name: read
    await:
      request:
        method: GET
        path: /v1/payments/{{payment_id}}
      until:
        status: 200
        equals:
          /status: failed
      within: 20s
      every: 2s
    expect:
      media-type: application/json
      schema: payment
      equals:
        /failure_reason: declined
      present:
        - /failure_detail/code
        - /failure_detail/message
