requirement: CDV-7.2
title: Insufficient funds at the operator give a failed payment in 200 with failure_reason insufficient_funds
provider: mock_openfsp
steps:
  - name: declare INSUFFICIENT under the derived order id
    simulator:
      declare:
        operator: "{{provider}}"
        order: "{{order}}"
        scenario: INSUFFICIENT
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: the operator refuses the payment
    simulator:
      settled:
        operator: "{{provider}}"
        order: "{{order}}"
  - name: synchronize
    await:
      request:
        method: POST
        path: /v1/payments/{{payment_id}}/synchronize
      until:
        status: 200
        equals:
          /status: failed
      within: 20s
      every: 2s
    expect:
      schema: payment
      equals:
        /failure_reason: insufficient_funds
