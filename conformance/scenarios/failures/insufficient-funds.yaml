requirement: CDV-7.2
title: Insufficient funds at the provider give a failed payment in 200 with failure_reason insufficient_funds
with-capabilities:
  - payments.lookup
steps:
  - name: declare INSUFFICIENT under the reference
    control:
      declare:
        reference: "{{reference}}"
        scenario: INSUFFICIENT
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: the provider refuses the payment
    control:
      settled:
        reference: "{{reference}}"
  - name: read
    await:
      request:
        method: GET
        path: /v1/payments/{{payment_id}}
      until:
        status: 200
        equals:
          /status: failed
      within: 20s
      every: 2s
    expect:
      schema: payment
      equals:
        /failure_reason: insufficient_funds
