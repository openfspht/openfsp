requirement: WH-8.1
title: The creation and the success of a payment are its events 1 and 2, delivered once each
steps:
  - name: declare SUCCESS under the reference
    simulator:
      declare:
        provider: "{{provider}}"
        reference: "{{reference}}"
        scenario: SUCCESS
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: the creation is event 1
    webhook:
      where:
        /resource_id: "{{payment_id}}"
        /type: payment.created
      within: 20s
    expect:
      equals:
        /sequence: 1
  - name: the success is event 2
    webhook:
      where:
        /resource_id: "{{payment_id}}"
        /type: payment.succeeded
      within: 30s
    expect:
      equals:
        /sequence: 2
  - name: two events, no sequence reused
    webhook:
      where:
        /resource_id: "{{payment_id}}"
      count: 2
      during: 3s
