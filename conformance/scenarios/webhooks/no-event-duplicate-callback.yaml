requirement: WH-3.4
title: The same signed callback received several times gives a single payment.succeeded
provider: mock_openfsp
steps:
  - name: declare DUPLICATE_CALLBACK under the derived order id
    simulator:
      declare:
        operator: "{{provider}}"
        order: "{{order}}"
        scenario: DUPLICATE_CALLBACK
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: the operator delivers its callbacks
    simulator:
      settled:
        operator: "{{provider}}"
        order: "{{order}}"
        callbacks: 1
  - name: payment.succeeded is delivered
    webhook:
      where:
        /resource_id: "{{payment_id}}"
        /type: payment.succeeded
      within: 30s
  - name: only once
    webhook:
      where:
        /resource_id: "{{payment_id}}"
        /type: payment.succeeded
      count: 1
      during: 5s
