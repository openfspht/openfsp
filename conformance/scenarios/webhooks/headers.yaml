requirement: WH-4.2
title: A delivery is a JSON POST whose OpenFSP-Event-Id and OpenFSP-Event-Type repeat the body, with Content-Digest and attempt 1
steps:
  - name: declare PENDING_FOREVER under the reference
    simulator:
      declare:
        provider: "{{provider}}"
        reference: "{{reference}}"
        scenario: PENDING_FOREVER
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: payment.created
    webhook:
      method: POST
      where:
        /resource_id: "{{payment_id}}"
        /type: payment.created
      within: 20s
    expect:
      media-type: application/json
      header-equals-member:
        OpenFSP-Event-Id: /id
        OpenFSP-Event-Type: /type
      headers:
        OpenFSP-Delivery-Attempt: "1"
      headers-match:
        Content-Digest: ^sha-256=:[A-Za-z0-9+/]{43}=:$
