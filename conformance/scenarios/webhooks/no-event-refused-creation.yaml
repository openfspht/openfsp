requirement: WH-1.4
title: A creation refused for a missing amount emits no event, while an accepted one emits payment.created
provider: mock_openfsp
steps:
  - name: declare PENDING_FOREVER under the derived order id
    simulator:
      declare:
        operator: "{{provider}}"
        order: "{{order}}"
        scenario: PENDING_FOREVER
  - name: create without an amount
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key:refused}}"
      body:
        reference: "{{reference:refused}}"
        provider: "{{provider}}"
    expect:
      status: 400
  - name: create a valid payment
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: the valid payment is delivered
    webhook:
      where:
        /resource_id: "{{payment_id}}"
        /type: payment.created
      within: 20s
  - name: nothing is delivered for the refused creation
    webhook:
      where:
        /reference: "{{reference:refused}}"
      count: 0
      during: 3s
