requirement: API-5.1.8
title: A creation whose callback_url is plain http to a host other than the loopback is refused with invalid-field on /callback_url and creates nothing
provider: mock_openfsp
steps:
  - name: create with an http callback_url
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
        callback_url: http://callbacks.openfsp.example/{{reference}}
    expect:
      status: 422
      media-type: application/problem+json
      schema: problem
      equals:
        /type: https://openfsp.org/problems/invalid-field
        /errors/*/field: /callback_url
      present:
        - /errors/0
  - name: nothing was created
    request:
      method: GET
      path: /v1/payments?reference={{reference}}
    expect:
      status: 200
      equals:
        /data: []
