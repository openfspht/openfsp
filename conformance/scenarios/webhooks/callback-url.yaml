requirement: API-5.1.8
title: A payment created with a callback_url gets its terminal event delivered there as a signed JSON POST that verifies with a key of the configuration document
steps:
  - name: configuration
    setup: true
    request:
      method: GET
      path: /.well-known/openfsp-configuration
      auth: none
    expect:
      status: 200
      present:
        - /webhook_keys/0
  - name: declare SUCCESS for the reference
    simulator:
      declare:
        provider: "{{provider}}"
        reference: "{{reference}}"
        scenario: SUCCESS
  - name: create with the receiver as callback_url
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
        callback_url: "{{webhook_url}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: the payment succeeds
    setup: true
    await:
      request:
        method: GET
        path: /v1/payments/{{payment_id}}
      until:
        status: 200
        equals:
          /status: succeeded
      within: 30s
      every: 1s
    capture:
      completed_at: /completed_at
  - name: payment.succeeded is delivered to the callback_url
    webhook:
      method: POST
      where:
        /resource_id: "{{payment_id}}"
        /type: payment.succeeded
      within: 30s
    expect:
      media-type: application/json
      schema: event
      header-equals-member:
        OpenFSP-Event-Id: /id
        OpenFSP-Event-Type: /type
      headers-match:
        Content-Digest: ^sha-256=:[A-Za-z0-9+/]{43}=:$
        Signature-Input: ^sig1=\("@method" "@target-uri" "content-type" "content-digest" "openfsp-event-id" "openfsp-event-type"\)(?=.*;created=[0-9]+(;|$))(?=.*;expires=[0-9]+(;|$))(?=.*;keyid="[^"]+")(?=.*;nonce="[A-Za-z0-9_-]{22,}")(?=.*;alg="ed25519")(?=.*;tag="openfsp-webhook")
      equals:
        /resource_type: payment
        /reference: "{{reference}}"
        /previous_status: pending
        /data/id: "{{payment_id}}"
        /data/reference: "{{reference}}"
        /data/status: succeeded
        /data/completed_at: "{{completed_at}}"
  - name: the delivery verifies with a published key
    check:
      name: http-message-signature
      from: configuration
      pointer: /webhook_keys
