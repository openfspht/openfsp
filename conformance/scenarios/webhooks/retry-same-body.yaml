requirement: WH-4.7
title: A delivery answered 500 is retried after at least 30 seconds as attempt 2 of the same event, byte-identical and signed afresh
steps:
  - name: configuration
    setup: true
    request:
      method: GET
      path: /.well-known/openfsp-configuration
      auth: none
    expect:
      status: 200
  - name: declare PENDING_FOREVER under the reference
    control:
      declare:
        reference: "{{reference}}"
        scenario: PENDING_FOREVER
  - name: answer 500 to the first delivery of payment.created
    receiver:
      reply:
        where:
          /reference: "{{reference}}"
          /type: payment.created
        status: 500
        times: 1
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: first attempt
    webhook:
      where:
        /resource_id: "{{payment_id}}"
        /type: payment.created
      within: 20s
    expect:
      headers:
        OpenFSP-Delivery-Attempt: "1"
  - name: second attempt
    webhook:
      where:
        /resource_id: "{{payment_id}}"
        /type: payment.created
      pick: 2
      within: 90s
      every: 1s
      after: first attempt
      not-sooner: 30s
    expect:
      same-body-as: first attempt
      headers:
        OpenFSP-Delivery-Attempt: "2"
      header-equals-member:
        OpenFSP-Event-Id: /id
  - name: the retry verifies with a published key, under a nonce and a created of its own
    check:
      name: http-message-signature
      from: configuration
      pointer: /webhook_keys
      renewed-from: first attempt
