requirement: WH-3.2
title: A payment expired by the operator is delivered as payment.expired with previous_status pending
provider: mock_openfsp
steps:
  - name: declare EXPIRE under the derived order id
    simulator:
      declare:
        operator: "{{provider}}"
        order: "{{order}}"
        scenario: EXPIRE
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: expired after the deadline
    setup: true
    await:
      request:
        method: POST
        path: /v1/payments/{{payment_id}}/synchronize
      until:
        status: 200
        equals:
          /status: expired
      within: 100s
      every: 10s
  - name: payment.expired
    webhook:
      where:
        /resource_id: "{{payment_id}}"
        /type: payment.expired
      within: 30s
    expect:
      schema: event
      equals:
        /previous_status: pending
        /reference: "{{reference}}"
        /data/status: expired
