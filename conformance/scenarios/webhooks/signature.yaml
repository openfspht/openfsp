requirement: WH-5.3
title: A delivery is signed under sig1 over the six listed components with created, expires, keyid, nonce, alg ed25519 and tag openfsp-webhook, and verifies with a published key
steps:
  - name: configuration
    setup: true
    request:
      method: GET
      path: /.well-known/openfsp-configuration
      auth: none
    expect:
      status: 200
  - name: declare PENDING_FOREVER under the reference
    control:
      declare:
        reference: "{{reference}}"
        scenario: PENDING_FOREVER
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: payment.created
    webhook:
      where:
        /resource_id: "{{payment_id}}"
        /type: payment.created
      within: 20s
    expect:
      headers-present:
        - Signature
      headers-match:
        Signature-Input: ^sig1=\("@method" "@target-uri" "content-type" "content-digest" "openfsp-event-id" "openfsp-event-type"\)(?=.*;created=[0-9]+(;|$))(?=.*;expires=[0-9]+(;|$))(?=.*;keyid="[^"]+")(?=.*;nonce="[A-Za-z0-9_-]{22,}")(?=.*;alg="ed25519")(?=.*;tag="openfsp-webhook")
  - name: the signature verifies with a published key
    check:
      name: http-message-signature
      from: configuration
      pointer: /webhook_keys
