requirement: WH-3.4
title: Synchronizing a payment that stays pending emits nothing beyond payment.created
provider: mock_openfsp
steps:
  - name: declare PENDING_FOREVER under the derived order id
    simulator:
      declare:
        operator: "{{provider}}"
        order: "{{order}}"
        scenario: PENDING_FOREVER
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: payment.created
    webhook:
      where:
        /resource_id: "{{payment_id}}"
        /type: payment.created
      within: 20s
  - name: synchronize once
    setup: true
    request:
      method: POST
      path: /v1/payments/{{payment_id}}/synchronize
    expect:
      status: 200
      equals:
        /status: pending
  - name: synchronize again
    setup: true
    request:
      method: POST
      path: /v1/payments/{{payment_id}}/synchronize
    expect:
      status: 200
      equals:
        /status: pending
  - name: no other event
    webhook:
      where:
        /resource_id: "{{payment_id}}"
      count: 1
      during: 3s
