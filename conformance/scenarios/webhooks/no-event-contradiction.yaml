requirement: WH-1.4
title: An operator that reports success then failure gives payment.succeeded and never payment.failed
provider: mock_openfsp
steps:
  - name: declare CONTRADICT under the derived order id
    simulator:
      declare:
        operator: "{{provider}}"
        order: "{{order}}"
        scenario: CONTRADICT
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: the first report makes it succeeded
    setup: true
    await:
      request:
        method: POST
        path: /v1/payments/{{payment_id}}/synchronize
      until:
        status: 200
        equals:
          /status: succeeded
      within: 30s
      every: 2s
  - name: synchronize after the contradicting report
    setup: true
    request:
      method: POST
      path: /v1/payments/{{payment_id}}/synchronize
    expect:
      status: 200
  - name: payment.succeeded is delivered
    webhook:
      where:
        /resource_id: "{{payment_id}}"
        /type: payment.succeeded
      within: 30s
  - name: payment.failed is never delivered
    webhook:
      where:
        /resource_id: "{{payment_id}}"
        /type: payment.failed
      count: 0
      during: 3s
