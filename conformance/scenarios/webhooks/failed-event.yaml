requirement: WH-3.2
title: A declined payment is delivered as payment.failed with previous_status pending and its failure reason
with-capabilities:
  - payments.lookup
steps:
  - name: declare DECLINE under the reference
    control:
      declare:
        reference: "{{reference}}"
        scenario: DECLINE
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: failed
    setup: true
    await:
      request:
        method: POST
        path: /v1/payments/{{payment_id}}/synchronize
      until:
        status: 200
        equals:
          /status: failed
      within: 30s
      every: 2s
  - name: payment.failed
    webhook:
      where:
        /resource_id: "{{payment_id}}"
        /type: payment.failed
      within: 30s
    expect:
      schema: event
      equals:
        /previous_status: pending
        /reference: "{{reference}}"
        /data/status: failed
        /data/failure_reason: declined
