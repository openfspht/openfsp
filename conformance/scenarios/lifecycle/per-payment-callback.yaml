requirement: CDV-6.5.c
title: A success callback the operator sends to the per-payment URL makes the payment succeeded without a synchronization by the client
provider: mock_natcash
steps:
  - name: declare SUCCESS under the derived order id
    simulator:
      declare:
        operator: "{{provider}}"
        order: "{{order}}"
        scenario: SUCCESS
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
      equals:
        /status: pending
    capture:
      payment_id: /id
  - name: the operator delivers its callback
    simulator:
      settled:
        operator: "{{provider}}"
        order: "{{order}}"
        callbacks: 1
  - name: the payment is succeeded
    await:
      request:
        method: GET
        path: /v1/payments/{{payment_id}}
      until:
        status: 200
        equals:
          /status: succeeded
      within: 20s
      every: 500ms
    expect:
      schema: payment
      present:
        - /completed_at
