requirement: CDV-6.6
title: A success callback on the per-payment URL with a wrong token is rejected without effect
provider: mock_natcash
steps:
  - name: declare PENDING_FOREVER under the derived order id
    simulator:
      declare:
        operator: "{{provider}}"
        order: "{{order}}"
        scenario: PENDING_FOREVER
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
      equals:
        /status: pending
    capture:
      payment_id: /id
  - name: read the per-payment URL the operator received
    setup: true
    journal:
      operator: "{{provider}}"
      contains: "{{order}}"
      method: POST
      at-least: 1
      capture:
        callback_url: /body/callbackUrl
  - name: forge a success callback with another token
    request:
      method: POST
      path: "{{callback_url}}0"
      auth: none
      body:
        orderNumber: "{{order}}"
        code: "1"
        transId: MN-forged
        signature: forged
  - name: the payment is still pending
    request:
      method: GET
      path: /v1/payments/{{payment_id}}
    expect:
      status: 200
      schema: payment
      equals:
        /status: pending
  - name: the operator still reports it pending
    request:
      method: POST
      path: /v1/payments/{{payment_id}}/synchronize
    expect:
      status: 200
      equals:
        /status: pending
