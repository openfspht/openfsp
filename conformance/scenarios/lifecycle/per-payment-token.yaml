requirement: CDV-6.6.token
title: Two payments receive two distinct callback URLs whose last segment carries at least 128 bits
provider: mock_natcash
steps:
  - name: declare PENDING_FOREVER under the first derived order id
    simulator:
      declare:
        operator: "{{provider}}"
        order: "{{order}}"
        scenario: PENDING_FOREVER
  - name: declare PENDING_FOREVER under the second derived order id
    simulator:
      declare:
        operator: "{{provider}}"
        order: "{{order:second}}"
        scenario: PENDING_FOREVER
  - name: create the first payment
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
  - name: create the second payment
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key:second}}"
      body:
        reference: "{{reference:second}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
  - name: the first URL ends with a token of at least 128 bits
    journal:
      operator: "{{provider}}"
      contains: "{{order}}"
      method: POST
      at-least: 1
      capture:
        callback_url: /body/callbackUrl
    expect:
      matches:
        /body/callbackUrl: /([A-Za-z0-9_-]{22,}|[0-9a-fA-F]{32,})$
  - name: no other creation received the first URL
    journal:
      operator: "{{provider}}"
      contains: "{{callback_url}}"
      method: POST
      count: 1
  - name: the second URL ends with a token of at least 128 bits
    journal:
      operator: "{{provider}}"
      contains: "{{order:second}}"
      method: POST
      at-least: 1
    expect:
      matches:
        /body/callbackUrl: /([A-Za-z0-9_-]{22,}|[0-9a-fA-F]{32,})$
