requirement: CDV-6.4
title: An operator that reports success then failure leaves the succeeded payment unchanged
provider: mock_openfsp
steps:
  - name: declare CONTRADICT under the derived order id
    simulator:
      declare:
        operator: "{{provider}}"
        order: "{{order}}"
        scenario: CONTRADICT
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: the first report makes it succeeded
    setup: true
    await:
      request:
        method: POST
        path: /v1/payments/{{payment_id}}/synchronize
      until:
        status: 200
        equals:
          /status: succeeded
      within: 30s
      every: 2s
    capture:
      completed_at: /completed_at
  - name: synchronize after the contradicting report
    request:
      method: POST
      path: /v1/payments/{{payment_id}}/synchronize
    expect:
      status: 200
      equals:
        /status: succeeded
        /completed_at: "{{completed_at}}"
  - name: read
    request:
      method: GET
      path: /v1/payments/{{payment_id}}
    expect:
      status: 200
      schema: payment
      equals:
        /status: succeeded
        /completed_at: "{{completed_at}}"
