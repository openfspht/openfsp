requirement: CDV-2.1
title: A pending payment reaches succeeded on a confirmed capture and failed on a refusal, both on read
steps:
  - name: declare PENDING_FOREVER under the reference
    control:
      declare:
        reference: "{{reference}}"
        scenario: PENDING_FOREVER
  - name: declare PENDING_FOREVER under the second reference
    control:
      declare:
        reference: "{{reference:declined}}"
        scenario: PENDING_FOREVER
  - name: create the payment that succeeds
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
      equals:
        /status: pending
    capture:
      succeeded_id: /id
  - name: create the payment that fails
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key:declined}}"
      body:
        reference: "{{reference:declined}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
      equals:
        /status: pending
    capture:
      failed_id: /id
  - name: the provider confirms the capture
    control:
      resolve:
        reference: "{{reference}}"
        outcome: succeeded
  - name: the provider refuses the second payment
    control:
      resolve:
        reference: "{{reference:declined}}"
        outcome: failed
        reason: declined
  - name: pending to succeeded
    await:
      request:
        method: GET
        path: /v1/payments/{{succeeded_id}}
      until:
        status: 200
        equals:
          /status: succeeded
      within: 30s
      every: 2s
    expect:
      schema: payment
  - name: pending to failed
    await:
      request:
        method: GET
        path: /v1/payments/{{failed_id}}
      until:
        status: 200
        equals:
          /status: failed
      within: 30s
      every: 2s
    expect:
      schema: payment
