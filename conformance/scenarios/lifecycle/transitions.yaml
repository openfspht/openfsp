requirement: CDV-2.1
title: A pending payment reaches succeeded on a confirmed capture and failed on a refusal, both on read
with-capabilities:
  - payments.lookup
steps:
  - name: declare SUCCESS under the reference
    control:
      declare:
        reference: "{{reference}}"
        scenario: SUCCESS
  - name: declare DECLINE under the second reference
    control:
      declare:
        reference: "{{reference:declined}}"
        scenario: DECLINE
  - name: create the payment that succeeds
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
      equals:
        /status: pending
    capture:
      succeeded_id: /id
  - name: create the payment that fails
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key:declined}}"
      body:
        reference: "{{reference:declined}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
      equals:
        /status: pending
    capture:
      failed_id: /id
  - name: pending to succeeded
    await:
      request:
        method: GET
        path: /v1/payments/{{succeeded_id}}
      until:
        status: 200
        equals:
          /status: succeeded
      within: 30s
      every: 2s
    expect:
      schema: payment
  - name: pending to failed
    await:
      request:
        method: GET
        path: /v1/payments/{{failed_id}}
      until:
        status: 200
        equals:
          /status: failed
      within: 30s
      every: 2s
    expect:
      schema: payment
