requirement: API-5.3.3
title: Synchronizing a terminal payment answers 200 with the payment unchanged without reading the state again
steps:
  - name: declare SUCCESS under the reference
    simulator:
      declare:
        provider: "{{provider}}"
        reference: "{{reference}}"
        scenario: SUCCESS
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: wait for the terminal state
    setup: true
    await:
      request:
        method: GET
        path: /v1/payments/{{payment_id}}
      until:
        status: 200
        equals:
          /status: succeeded
      within: 20s
      every: 1s
    capture:
      updated_at: /updated_at
      completed_at: /completed_at
  - name: synchronize
    request:
      method: POST
      path: /v1/payments/{{payment_id}}/synchronize
    expect:
      status: 200
      schema: payment
      equals:
        /id: "{{payment_id}}"
        /status: succeeded
        /updated_at: "{{updated_at}}"
        /completed_at: "{{completed_at}}"
