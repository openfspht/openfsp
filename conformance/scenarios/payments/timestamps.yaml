requirement: MDD-7.1
title: Every timestamp of a payment, pending then terminal, is an RFC 3339 date-time in UTC with an uppercase Z
variables:
  utc: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,3})?Z$
with-capabilities:
  - payments.lookup
steps:
  - name: declare SUCCESS under the reference
    simulator:
      declare:
        provider: "{{provider}}"
        reference: "{{reference}}"
        scenario: SUCCESS
  - name: create
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
      matches:
        /created_at: "{{utc}}"
        /updated_at: "{{utc}}"
    capture:
      payment_id: /id
  - name: terminal
    await:
      request:
        method: POST
        path: /v1/payments/{{payment_id}}/synchronize
      until:
        status: 200
        equals:
          /status: succeeded
      within: 30s
      every: 2s
    expect:
      matches:
        /created_at: "{{utc}}"
        /updated_at: "{{utc}}"
        /completed_at: "{{utc}}"
