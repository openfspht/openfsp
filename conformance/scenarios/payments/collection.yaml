requirement: API-1.12
title: A lookup by reference answers an object with a data array, never a bare array
steps:
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
  - name: collection with one element
    request:
      method: GET
      path: /v1/payments?reference={{reference}}
    expect:
      status: 200
      schema: collection
  - name: empty collection
    request:
      method: GET
      path: /v1/payments?reference={{reference:unknown}}
    expect:
      status: 200
      schema: collection
