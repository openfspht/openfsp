requirement: API-1.9
title: An unknown member nested in a known object of the request is refused in 400 with unknown-field naming it
steps:
  - name: unknown member in amount
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
          precision: 2
        provider: "{{provider}}"
    expect:
      status: 400
      media-type: application/problem+json
      schema: problem
      equals:
        /type: https://openfsp.org/problems/unknown-field
        /errors/0/field: /amount/precision
        /errors/0/code: unknown_field
  - name: nothing was created
    request:
      method: GET
      path: /v1/payments?reference={{reference}}
    expect:
      status: 200
      equals:
        /data: []
