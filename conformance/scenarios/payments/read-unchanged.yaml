requirement: API-5.2.4
title: A read that establishes no new state answers 200 with the payment unchanged
steps:
  - name: declare PENDING_FOREVER under the reference
    control:
      declare:
        reference: "{{reference}}"
        scenario: PENDING_FOREVER
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: first read
    request:
      method: GET
      path: /v1/payments/{{payment_id}}
    expect:
      status: 200
      equals:
        /status: pending
  - name: read again while the provider reports it pending
    request:
      method: GET
      path: /v1/payments/{{payment_id}}
    expect:
      status: 200
      media-type: application/json
      same-body-as: first read
