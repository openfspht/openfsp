requirement: API-5.2.2
title: Reading by reference gives one payment for a known reference and an empty data for an unknown one
steps:
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: known reference
    request:
      method: GET
      path: /v1/payments?reference={{reference}}
    expect:
      status: 200
      schema: payment-collection
      equals:
        /data/0/id: "{{payment_id}}"
        /data/0/reference: "{{reference}}"
      absent:
        - /data/1
  - name: unknown reference
    request:
      method: GET
      path: /v1/payments?reference={{reference:unknown}}
    expect:
      status: 200
      equals:
        /data: []
