requirement: API-5.3.7
title: A synchronization that establishes no new state answers 200 with the payment unchanged
with-capabilities:
  - payments.lookup
steps:
  - name: declare PENDING_FOREVER under the reference
    simulator:
      declare:
        provider: "{{provider}}"
        reference: "{{reference}}"
        scenario: PENDING_FOREVER
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: read before the synchronization
    request:
      method: GET
      path: /v1/payments/{{payment_id}}
    expect:
      status: 200
      equals:
        /status: pending
  - name: synchronize while the provider reports it pending
    request:
      method: POST
      path: /v1/payments/{{payment_id}}/synchronize
    expect:
      status: 200
      media-type: application/json
      same-body-as: read before the synchronization
