requirement: MDD-8.3
title: A creation that sets the fee and its bearer is refused and creates nothing
provider: mock_openfsp
steps:
  - name: create with a fee borne by the payer
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
        fee:
          amount:
            amount: 0
            currency: HTG
          bearer: payer
    expect:
      status: 400
      media-type: application/problem+json
      schema: problem
  - name: no payment exists under the reference
    request:
      method: GET
      path: /v1/payments?reference={{reference}}
    expect:
      status: 200
      schema: collection
      absent:
        - /data/0
