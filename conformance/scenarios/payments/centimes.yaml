requirement: MDD-3.2
title: An amount in centimes is created and reads back as the same integer
steps:
  - name: create
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125100
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
      equals:
        /amount/amount: 125100
        /amount/currency: HTG
    capture:
      payment_id: /id
  - name: read
    request:
      method: GET
      path: /v1/payments/{{payment_id}}
    expect:
      status: 200
      equals:
        /amount/amount: 125100
