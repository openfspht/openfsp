requirement: CAP-5.2
title: A payment settled without callback reaches the state reported by the provider lookup on read
with-capabilities:
  - payments.lookup
steps:
  - name: declare NO_CALLBACK under the reference
    control:
      declare:
        reference: "{{reference}}"
        scenario: NO_CALLBACK
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
      equals:
        /status: pending
    capture:
      payment_id: /id
  - name: read until terminal
    await:
      request:
        method: GET
        path: /v1/payments/{{payment_id}}
      until:
        status: 200
        equals:
          /status: succeeded
      within: 30s
      every: 3s
    expect:
      schema: payment
