requirement: CDV-10.3.6
title: The statement of a provider that does not announce payments.statement is served as an empty collection
assisted:
  action: Issue a key of the target environment with the scope statements:read and pass it as --input statements-key=KEY.
  inputs:
    - statements-key
without-capabilities:
  - payments.statement
steps:
  - name: statement of the business day
    request:
      method: GET
      path: /v1/statements?provider={{provider}}&business_date={{today:America/Port-au-Prince}}
      auth: "{{input.statements-key}}"
    expect:
      status: 200
      schema: statement
      absent:
        - /data/0
        - /next_cursor
  - name: statement of a range
    request:
      method: GET
      path: /v1/statements?provider={{provider}}&from={{today:America/Port-au-Prince - 1}}&to={{today:America/Port-au-Prince}}
      auth: "{{input.statements-key}}"
    expect:
      status: 200
      schema: statement
      absent:
        - /data/0
        - /next_cursor
