requirement: CDV-10.3.2
title: A range returns only the entries of its days, both ends included
assisted:
  action: Issue a key of the target environment with the scope statements:read and pass it as --input statements-key=KEY.
  inputs:
    - statements-key
with-capabilities:
  - payments.lookup
steps:
  - name: declare SUCCESS under the reference
    control:
      declare:
        reference: "{{reference}}"
        scenario: SUCCESS
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: succeeded
    setup: true
    await:
      request:
        method: GET
        path: /v1/payments/{{payment_id}}
      until:
        status: 200
        equals:
          /status: succeeded
      within: 30s
      every: 2s
  - name: a range ending on the business day lists the payment
    await:
      request:
        method: GET
        path: /v1/statements?provider={{provider}}&from={{today:America/Port-au-Prince - 1}}&to={{today:America/Port-au-Prince}}&limit=100
        auth: "{{input.statements-key}}"
      until:
        status: 200
        present:
          - "/data/[payment={{payment_id}}]"
      within: 30s
      every: 2s
    expect:
      schema: statement
      equals:
        "/data/[payment={{payment_id}}]/business_date": "{{today:America/Port-au-Prince}}"
  - name: a range starting on the business day lists the payment
    request:
      method: GET
      path: /v1/statements?provider={{provider}}&from={{today:America/Port-au-Prince}}&to={{today:America/Port-au-Prince + 1}}&limit=100
      auth: "{{input.statements-key}}"
    expect:
      status: 200
      schema: statement
      present:
        - "/data/[payment={{payment_id}}]"
  - name: a range ending the day before does not list the payment
    request:
      method: GET
      path: /v1/statements?provider={{provider}}&from={{today:America/Port-au-Prince - 2}}&to={{today:America/Port-au-Prince - 1}}&limit=100
      auth: "{{input.statements-key}}"
    expect:
      status: 200
      schema: statement
      absent:
        - "/data/[payment={{payment_id}}]"
        - "/data/[business_date={{today:America/Port-au-Prince}}]"
  - name: a range starting the day after does not list the payment
    request:
      method: GET
      path: /v1/statements?provider={{provider}}&from={{today:America/Port-au-Prince + 1}}&to={{today:America/Port-au-Prince + 2}}&limit=100
      auth: "{{input.statements-key}}"
    expect:
      status: 200
      schema: statement
      absent:
        - "/data/[payment={{payment_id}}]"
        - "/data/[business_date={{today:America/Port-au-Prince}}]"
