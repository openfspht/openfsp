requirement: CDV-10.2.1
title: A successful payment appears in the statement of its business day with its id and its reference
assisted:
  action: Issue a key of the target environment with the scope statements:read and pass it as --input statements-key=KEY.
  inputs:
    - statements-key
with-capabilities:
  - payments.lookup
steps:
  - name: declare SUCCESS under the reference
    control:
      declare:
        reference: "{{reference}}"
        scenario: SUCCESS
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: succeeded
    setup: true
    await:
      request:
        method: POST
        path: /v1/payments/{{payment_id}}/synchronize
      until:
        status: 200
        equals:
          /status: succeeded
      within: 30s
      every: 2s
  - name: the statement of the business day lists the payment
    await:
      request:
        method: GET
        path: /v1/statements?provider={{provider}}&business_date={{today:America/Port-au-Prince}}&limit=100
        auth: "{{input.statements-key}}"
      until:
        status: 200
        present:
          - "/data/[payment={{payment_id}}]"
      within: 30s
      every: 2s
    expect:
      schema: statement
      equals:
        "/data/[payment={{payment_id}}]/provider": "{{provider}}"
        "/data/[payment={{payment_id}}]/business_date": "{{today:America/Port-au-Prince}}"
        "/data/[payment={{payment_id}}]/reference": "{{reference}}"
        "/data/[payment={{payment_id}}]/amount/amount": 125000
        "/data/[payment={{payment_id}}]/amount/currency": HTG
      present:
        - "/data/[payment={{payment_id}}]/booked_at"
