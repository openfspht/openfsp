requirement: CDV-10.3.3
title: A range of 31 business days is served, a longer one is refused with invalid-field
assisted:
  action: Issue a key of the target environment with the scope statements:read and pass it as --input statements-key=KEY.
  inputs:
    - statements-key
steps:
  - name: 31 business days
    request:
      method: GET
      path: /v1/statements?provider={{provider}}&from={{today:America/Port-au-Prince - 30}}&to={{today:America/Port-au-Prince}}&limit=1
      auth: "{{input.statements-key}}"
    expect:
      status: 200
      schema: statement
  - name: 32 business days
    request:
      method: GET
      path: /v1/statements?provider={{provider}}&from={{today:America/Port-au-Prince - 31}}&to={{today:America/Port-au-Prince}}
      auth: "{{input.statements-key}}"
    expect:
      status: 422
      media-type: application/problem+json
      schema: problem
      equals:
        /type: https://openfsp.org/problems/invalid-field
        /retryable: false
        /effect: none
