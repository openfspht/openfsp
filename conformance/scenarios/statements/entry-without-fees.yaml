requirement: CDV-10.2.4
title: The statement entry of a payment whose provider reports no fee carries neither fee_amount nor net_amount
assisted:
  action: Issue a key of the target environment with the scope statements:read and pass it as --input statements-key=KEY.
  inputs:
    - statements-key
with-capabilities:
  - payments.lookup
steps:
  - name: declare SUCCESS under the reference
    simulator:
      declare:
        provider: "{{provider}}"
        reference: "{{reference}}"
        scenario: SUCCESS
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: succeeded
    setup: true
    await:
      request:
        method: POST
        path: /v1/payments/{{payment_id}}/synchronize
      until:
        status: 200
        equals:
          /status: succeeded
      within: 30s
      every: 2s
  - name: the entry carries no computed fee
    await:
      request:
        method: GET
        path: /v1/statements?provider={{provider}}&business_date={{today:America/Port-au-Prince}}&limit=100
        auth: "{{input.statements-key}}"
      until:
        status: 200
        present:
          - "/data/[payment={{payment_id}}]"
      within: 30s
      every: 2s
    expect:
      schema: statement
      present:
        - "/data/[payment={{payment_id}}]/amount"
      absent:
        - "/data/[payment={{payment_id}}]/fee_amount"
        - "/data/[payment={{payment_id}}]/net_amount"
