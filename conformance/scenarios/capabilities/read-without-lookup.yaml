requirement: CAP-5.3
title: Reading a pending payment without payments.lookup answers 200 with the state known to the server
without-capabilities:
  - payments.lookup
steps:
  - name: declare PENDING_FOREVER under the reference
    control:
      declare:
        reference: "{{reference}}"
        scenario: PENDING_FOREVER
  - name: the provider does not announce payments.lookup
    setup: true
    request:
      method: GET
      path: /v1/capabilities
    expect:
      status: 200
      matches:
        "/providers/[id={{provider}}]/capabilities/*": ^(?!payments\.lookup$)
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: read
    request:
      method: GET
      path: /v1/payments/{{payment_id}}
    expect:
      status: 200
      schema: payment
      equals:
        /id: "{{payment_id}}"
        /status: pending
