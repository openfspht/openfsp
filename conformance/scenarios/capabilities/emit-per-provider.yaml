requirement: CAP-3.2.5
title: A server that emits events lists webhooks.emit for the provider and among the capabilities it supports
steps:
  - name: capabilities
    request:
      method: GET
      path: /v1/capabilities
    expect:
      status: 200
      schema: capabilities
      present:
        - "/providers/[id={{provider}}]/capabilities/[=webhooks.emit]"
  - name: configuration document
    request:
      method: GET
      path: /.well-known/openfsp-configuration
      auth: none
    expect:
      status: 200
      schema: discovery
      present:
        - "/capabilities_supported/[=webhooks.emit]"
