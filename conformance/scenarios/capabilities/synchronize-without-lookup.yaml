requirement: CAP-5.3
title: Synchronizing a pending payment without payments.lookup is refused with capability-not-supported, not answered with the stored state
provider: mock_statement_only
without-capability: payments.lookup
steps:
  - name: declare PENDING_FOREVER under the derived order id
    simulator:
      declare:
        operator: "{{provider}}"
        order: "{{order}}"
        scenario: PENDING_FOREVER
  - name: the operator does not announce payments.lookup
    setup: true
    request:
      method: GET
      path: /v1/capabilities
    expect:
      status: 200
      matches:
        "/providers/[id={{provider}}]/capabilities/*": ^(?!payments\.lookup$)
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: synchronize
    request:
      method: POST
      path: /v1/payments/{{payment_id}}/synchronize
    expect:
      status: 422
      media-type: application/problem+json
      schema: problem
      equals:
        /type: https://openfsp.org/problems/capability-not-supported
      absent:
        - /id
        - /provider_order_id
