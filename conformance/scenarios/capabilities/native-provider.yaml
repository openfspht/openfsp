requirement: CAP-3.2.6
title: A native operator describes a single provider, itself, which names the payments it creates
targets:
  - native-operator
steps:
  - name: capabilities
    request:
      method: GET
      path: /v1/capabilities
    expect:
      status: 200
      schema: capabilities
      present:
        - /providers/0/id
      absent:
        - /providers/1
    capture:
      own_provider: /providers/0/id
  - name: create
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{own_provider}}"
    expect:
      status: 201
      equals:
        /provider: "{{own_provider}}"
