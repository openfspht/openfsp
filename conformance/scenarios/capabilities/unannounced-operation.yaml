requirement: CAP-4.4
title: An operation whose capability is not announced for the operator is refused with capability-not-supported
provider: mock_no_source
targets:
  - gateway
steps:
  - name: declare SUCCESS under the derived order id
    simulator:
      declare:
        operator: "{{provider}}"
        order: "{{order}}"
        scenario: SUCCESS
  - name: the operator announces payments alone, besides the gateway's own webhooks.emit
    setup: true
    request:
      method: GET
      path: /v1/capabilities
    expect:
      status: 200
      present:
        - "/providers/[id={{provider}}]"
      matches:
        "/providers/[id={{provider}}]/capabilities/*": ^(payments|webhooks\.emit)$
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: the operator settles the payment
    simulator:
      settled:
        operator: "{{provider}}"
        order: "{{order}}"
  - name: synchronize without payments.lookup
    request:
      method: POST
      path: /v1/payments/{{payment_id}}/synchronize
    expect:
      status: 422
      media-type: application/problem+json
      schema: problem
      equals:
        /type: https://openfsp.org/problems/capability-not-supported
        /retryable: false
        /effect: none
