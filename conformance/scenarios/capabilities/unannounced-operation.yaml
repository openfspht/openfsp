requirement: CAP-4.4
title: An operation whose capability is not announced for the provider is refused with capability-not-supported
without-capabilities:
  - payments.lookup
steps:
  - name: declare SUCCESS under the reference
    control:
      declare:
        reference: "{{reference}}"
        scenario: SUCCESS
  - name: the provider does not announce payments.lookup
    setup: true
    request:
      method: GET
      path: /v1/capabilities
    expect:
      status: 200
      present:
        - "/providers/[id={{provider}}]"
      matches:
        "/providers/[id={{provider}}]/capabilities/*": ^(?!payments\.lookup$)
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: the provider settles the payment
    control:
      settled:
        reference: "{{reference}}"
  - name: synchronize without payments.lookup
    request:
      method: POST
      path: /v1/payments/{{payment_id}}/synchronize
    expect:
      status: 422
      media-type: application/problem+json
      schema: problem
      equals:
        /type: https://openfsp.org/problems/capability-not-supported
        /retryable: false
        /effect: none
