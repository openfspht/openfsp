requirement: CAP-5.3.1
title: Synchronizing a terminal payment without payments.lookup answers 200 with the payment unchanged without reading the state again
without-capabilities:
  - payments.lookup
steps:
  - name: declare PENDING_FOREVER under the reference
    control:
      declare:
        reference: "{{reference}}"
        scenario: PENDING_FOREVER
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: resolve the payment as succeeded
    control:
      resolve:
        reference: "{{reference}}"
        outcome: succeeded
  - name: the payment is succeeded
    setup: true
    await:
      request:
        method: GET
        path: /v1/payments/{{payment_id}}
      until:
        status: 200
        equals:
          /status: succeeded
      within: 10s
      every: 1s
    capture:
      updated_at: /updated_at
      completed_at: /completed_at
  - name: synchronize
    request:
      method: POST
      path: /v1/payments/{{payment_id}}/synchronize
    expect:
      status: 200
      schema: payment
      equals:
        /id: "{{payment_id}}"
        /status: succeeded
        /updated_at: "{{updated_at}}"
        /completed_at: "{{completed_at}}"
