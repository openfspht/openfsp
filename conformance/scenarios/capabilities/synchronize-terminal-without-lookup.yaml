requirement: CAP-5.3.1
title: Synchronizing a terminal payment without payments.lookup answers 200 with the payment unchanged and no request to the operator
provider: mock_statement_only
without-capability: payments.lookup
steps:
  - name: declare SUCCESS under the derived order id
    simulator:
      declare:
        operator: "{{provider}}"
        order: "{{order}}"
        scenario: SUCCESS
  - name: create
    setup: true
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
    capture:
      payment_id: /id
  - name: the statement makes it succeeded
    setup: true
    await:
      request:
        method: GET
        path: /v1/payments/{{payment_id}}
      until:
        status: 200
        equals:
          /status: succeeded
      within: 150s
      every: 5s
    capture:
      updated_at: /updated_at
      completed_at: /completed_at
  - name: mark the journal
    targets:
      - gateway
    journal:
      operator: "{{provider}}"
      mark: before_synchronization
  - name: synchronize
    request:
      method: POST
      path: /v1/payments/{{payment_id}}/synchronize
    expect:
      status: 200
      schema: payment
      equals:
        /id: "{{payment_id}}"
        /status: succeeded
        /updated_at: "{{updated_at}}"
        /completed_at: "{{completed_at}}"
  - name: the operator was not called
    targets:
      - gateway
    journal:
      operator: "{{provider}}"
      since: before_synchronization
      path: ^/{{provider}}/v1/payments.*
      count: 0
