requirement: IDEM-3.4
title: Two concurrent creations under the same key are never executed in parallel, the second waits or is refused with idempotency-request-in-progress and Retry-After, and a resend replays the stored response
steps:
  - name: concurrent creations
    parallel:
      - name: first
        request:
          method: POST
          path: /v1/payments
          headers:
            Idempotency-Key: "{{key}}"
          body:
            reference: "{{reference}}"
            amount:
              amount: 125000
              currency: HTG
            provider: "{{provider}}"
        expect:
          any-of:
            - status: 201
            - status: 409
              headers-present:
                - Retry-After
              equals:
                /type: https://openfsp.org/problems/idempotency-request-in-progress
                /retryable: true
      - name: second
        request:
          method: POST
          path: /v1/payments
          headers:
            Idempotency-Key: "{{key}}"
          body:
            reference: "{{reference}}"
            amount:
              amount: 125000
              currency: HTG
            provider: "{{provider}}"
        expect:
          any-of:
            - status: 201
            - status: 409
              headers-present:
                - Retry-After
              equals:
                /type: https://openfsp.org/problems/idempotency-request-in-progress
                /retryable: true
  - name: one payment
    request:
      method: GET
      path: /v1/payments?reference={{reference}}
    expect:
      status: 200
      present:
        - /data/0
      absent:
        - /data/1
    capture:
      payment_id: /data/0/id
  - name: a resend replays the stored creation
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
      headers:
        Idempotent-Replay: "true"
      equals:
        /id: "{{payment_id}}"
  - name: a second resend replays the same body
    request:
      same-as: a resend replays the stored creation
    expect:
      status: 201
      headers:
        Idempotent-Replay: "true"
      same-body-as: a resend replays the stored creation
