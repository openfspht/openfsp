requirement: IDEM-1.3
title: A creation without Idempotency-Key is refused with idempotency-key-required and creates nothing
provider: mock_openfsp
steps:
  - name: create without key
    request:
      method: POST
      path: /v1/payments
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 400
      schema: problem
      equals:
        /type: https://openfsp.org/problems/idempotency-key-required
        /retryable: false
        /effect: none
  - name: no payment at the gateway
    request:
      method: GET
      path: /v1/payments?reference={{reference}}
    expect:
      status: 200
      equals:
        /data: []
  - name: no request reached the operator
    targets:
      - gateway
    journal:
      operator: "{{provider}}"
      method: POST
      contains: "{{order}}"
      count: 0
