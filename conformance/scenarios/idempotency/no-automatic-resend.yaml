requirement: IDEM-7.3
title: An undetermined creation at an operator without idempotency or lookup leaves the payment pending and is never resent automatically
provider: mock_no_source
steps:
  - name: declare TIMEOUT under the derived order id
    simulator:
      declare:
        operator: "{{provider}}"
        order: "{{order}}"
        scenario: TIMEOUT
  - name: create
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 504
      media-type: application/problem+json
      equals:
        /type: https://openfsp.org/problems/provider-timeout
        /effect: unknown
  - name: the operator records the creation once its answer is held back
    journal:
      operator: "{{provider}}"
      contains: "{{order}}"
      method: POST
      path: ^/{{provider}}/v1/payments$
      at-least: 1
      within: 60s
      every: 2s
  - name: no automatic resend
    journal:
      operator: "{{provider}}"
      contains: "{{order}}"
      method: POST
      path: ^/{{provider}}/v1/payments$
      count: 1
      during: 40s
      every: 3s
  - name: the payment is pending
    request:
      method: GET
      path: /v1/payments?reference={{reference}}
    expect:
      status: 200
      equals:
        /data/0/status: pending
