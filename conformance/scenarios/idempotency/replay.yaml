requirement: IDEM-3.2
title: The same key and body is replayed with the recorded status and body, Idempotent-Replay true, and one payment under the reference
steps:
  - name: first
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
  - name: replay
    request:
      same-as: first
    expect:
      status: 201
      headers:
        Idempotent-Replay: "true"
      same-body-as: first
  - name: one payment under the reference
    request:
      method: GET
      path: /v1/payments?reference={{reference}}
    expect:
      status: 200
      present:
        - /data/0
      absent:
        - /data/1
