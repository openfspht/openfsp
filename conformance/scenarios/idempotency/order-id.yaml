requirement: IDEM-7.2
title: provider_order_id equals the order id derived by the suite, the operator receives it, and the scenario declared under it applies
provider: mock_openfsp
steps:
  - name: declare DECLINE under the derived order id
    simulator:
      declare:
        operator: "{{provider}}"
        order: "{{order}}"
        scenario: DECLINE
  - name: create
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      status: 201
      equals:
        /provider_order_id: "{{order}}"
    capture:
      payment_id: /id
  - name: the operator received the order id
    journal:
      operator: "{{provider}}"
      method: POST
      path: ^/{{provider}}/v1/payments$
      contains: "{{order}}"
      count: 1
  - name: the declared scenario applies
    await:
      request:
        method: GET
        path: /v1/payments/{{payment_id}}
      until:
        status: 200
        equals:
          /status: failed
      within: 20s
      every: 1s
    expect:
      schema: payment
      equals:
        /failure_reason: declined
