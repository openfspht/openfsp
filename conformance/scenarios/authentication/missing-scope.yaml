requirement: AUTH-6.4
title: A key without statements:read is forbidden on the statement entries, never unauthenticated or not-found
assisted:
  action: Issue a key of the target environment that lacks the scope statements:read and pass it as --input restricted-key=KEY.
  inputs:
    - restricted-key
steps:
  - name: listing without the scope
    request:
      method: GET
      path: /v1/statement_entries?match=unmatched
      auth: "{{input.restricted-key}}"
    expect:
      status: 403
      media-type: application/problem+json
      schema: problem
      equals:
        /type: https://openfsp.org/problems/forbidden
        /retryable: false
        /effect: none
