requirement: AUTH-4.7
title: Missing, malformed and unknown keys give unauthenticated with the same title and no distinctive detail
steps:
  - name: missing
    request:
      method: GET
      path: /v1/capabilities
      auth: none
    expect:
      status: 401
      equals:
        /type: https://openfsp.org/problems/unauthenticated
    capture:
      title: /title
      detail: /detail
  - name: malformed
    request:
      method: GET
      path: /v1/capabilities
      auth: not-an-openfsp-key
    expect:
      status: 401
      equals:
        /type: https://openfsp.org/problems/unauthenticated
        /title: "{{title}}"
        /detail: "{{detail}}"
  - name: unknown
    request:
      method: GET
      path: /v1/capabilities
      auth: "ofsp_test_{{random:unknown}}"
    expect:
      status: 401
      equals:
        /type: https://openfsp.org/problems/unauthenticated
        /title: "{{title}}"
        /detail: "{{detail}}"
  - name: unknown in the other environment
    request:
      method: GET
      path: /v1/capabilities
      auth: "ofsp_live_{{random:unknown}}"
    expect:
      status: 401
      equals:
        /type: https://openfsp.org/problems/unauthenticated
        /title: "{{title}}"
        /detail: "{{detail}}"
