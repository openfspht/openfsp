requirement: AUTH-9.5
title: An operator that echoes the credentials it received in an error has them replaced by [REDACTED] in provider_detail
provider: mock_openfsp
steps:
  - name: declare CREDENTIAL_ECHO under the derived order id
    simulator:
      declare:
        operator: "{{provider}}"
        order: "{{order}}"
        scenario: CREDENTIAL_ECHO
  - name: create
    request:
      method: POST
      path: /v1/payments
      headers:
        Idempotency-Key: "{{key}}"
      body:
        reference: "{{reference}}"
        amount:
          amount: 125000
          currency: HTG
        provider: "{{provider}}"
    expect:
      media-type: application/problem+json
      schema: problem
      matches:
        /provider_detail/message: \[REDACTED\]
