  - id: IDEM-3.4
    requirement: idempotence.md#3.4
    level: core
    target: gateway
    title: A concurrent duplicate is never executed in parallel
  - id: IDEM-7.1
    requirement: idempotence.md#7.1
    level: core
    target: gateway
    title: An undetermined creation is established at an authoritative source before any resend
  - id: IDEM-7.3
    requirement: idempotence.md#7.3
