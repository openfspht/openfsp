  - id: MDD-2.1
    requirement: modele-de-donnees.md#2.1
    level: core
    target: gateway
    title: Request and response bodies are UTF-8 JSON
  - id: MDD-3.2
    requirement: modele-de-donnees.md#3.2
    level: core
    target: gateway
    title: An amount is an integer number of centimes
  - id: MDD-7.1
    requirement: modele-de-donnees.md#7.1
    level: core
    target: gateway
    title: Timestamps are RFC 3339 date-times in UTC with an uppercase Z
  - id: CDV-1.1
    requirement: cycle-de-vie.md#1.1
    level: core
    target: gateway
    title: An unknown operator status leaves the payment pending
  - id: CDV-2.1
    requirement: cycle-de-vie.md#2.1
    level: core
    target: gateway
    title: The transitions from pending are reachable
  - id: CDV-3.1
    requirement: cycle-de-vie.md#3.1
    level: core
    target: gateway
    title: A terminal payment never changes state on a later report
  - id: CDV-4
    requirement: cycle-de-vie.md#4
    level: core
    target: gateway
