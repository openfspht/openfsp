  - id: CDV-4.3
    requirement: cycle-de-vie.md#4.3
    level: core
    target: gateway
    title: A repeated callback keeps one transition and completed_at unchanged
  - id: CDV-5.3
    requirement: cycle-de-vie.md#5.3
    level: core
    target: gateway
    title: A statement without the payment before expires_at does not make it expired
  - id: CDV-6.3
    requirement: cycle-de-vie.md#6.3
    level: core
    target: gateway
    title: An unsigned callback outside the per-payment URL causes no transition
  - id: CDV-6.3.2
    requirement: cycle-de-vie.md#6.3.2
    level: core
    target: gateway
    title: A success reported for another amount never makes the payment succeeded
  - id: CDV-6.4
    requirement: cycle-de-vie.md#6.4
    level: core
    target: gateway
    title: A contradicting operator report does not modify a terminal payment
  - id: CDV-6.5
    requirement: cycle-de-vie.md#6.5
    level: payments.statement
    target: gateway
