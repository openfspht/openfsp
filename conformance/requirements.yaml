suite:
  version: 0.1.0
  protocol-version: 0.1.0
  discovery:
    path: /.well-known/openfsp-configuration
    protocol-version: /protocol_version
  capabilities:
    path: /v1/capabilities
    providers: /providers
    id: /id
    names: /capabilities
    return-url-required: /payments/return_url_required

limits:
  - reference: conformance#8.1
    text: A conformance report is not a security audit.
  - reference: conformance#6.3
    text: A result obtained against the mock server holds only for the configuration that produced it and says nothing of a real provider.

requirements:
  - id: AUTH-3.3
    requirement: authentication#3.3
    level: core
    targets:
      - server
    title: A request without a key is refused as unauthenticated with a Bearer challenge
  - id: AUTH-4.7
    requirement: authentication#4.7
    level: core
    targets:
      - server
    title: Missing, malformed and unknown keys produce the same unauthenticated problem
  - id: AUTH-6.4
    requirement: authentication#6.4
    level: core
    targets:
      - server
    title: A key without the required scope is refused as forbidden
  - id: API-1.4
    requirement: payments-api#1.4
    level: core
    targets:
      - server
    title: Successes are application/json and errors application/problem+json
  - id: API-1.8
    requirement: payments-api#1.8
    level: core
    targets:
      - server
    title: Every response carries Request-Id, equal to the problem request_id
  - id: API-1.12
    requirement: payments-api#1.12
    level: core
    targets:
      - server
    title: A collection is an object with a data array
  - id: API-3.1
    requirement: payments-api#3.1
    level: core
    targets:
      - server
    title: A created payment carries the mandatory Payment members
  - id: API-5.1
    requirement: payments-api#5.1
    level: core
    targets:
      - server
    title: A creation without a mandatory field is refused with missing-field
  - id: API-5.2.1
    requirement: payments-api#5.2.1
    level: core
    targets:
      - server
    title: Reading by id returns the payment, or not-found for an unknown id
  - id: API-5.2.2
    requirement: payments-api#5.2.2
    level: core
    targets:
      - server
    title: Reading by reference returns at most one payment, and an empty data for an unknown reference
  - id: API-5.2.4
    requirement: payments-api#5.2.4
    level: core
    targets:
      - server
    title: A read that establishes no new state answers 200 with the payment unchanged
  - id: API-5.2.5
    requirement: payments-api#5.2.5
    level: core
    targets:
      - server
    title: Reading a terminal payment returns it as recorded
  - id: API-10.1.1
    requirement: payments-api#10.1.1
    level: core
    targets:
      - server
    title: Every error is a problem detail
  - id: API-10.1.5
    requirement: payments-api#10.1.5
    level: core
    targets:
      - server
    title: The problem status member equals the HTTP status
  - id: API-10.7.1
    requirement: payments-api#10.7.1
    level: core
    targets:
      - server
    title: Field errors name a JSON Pointer and a code from the closed list
  - id: API-10.7.3
    requirement: payments-api#10.7.3
    level: core
    targets:
      - server
    title: Each field error designates the request as sent by the client
  - id: MDD-2.4
    requirement: data-model#2.4
    level: core
    targets:
      - server
    title: A request with an unknown member is refused in 400, naming the member
  - id: MDD-2.7
    requirement: data-model#2.7
    level: core
    targets:
      - server
    title: An amount sent as a string is refused with invalid-field
  - id: MDD-3.3
    requirement: data-model#3.3
    level: core
    targets:
      - server
    title: An amount with a fractional part or an exponent is refused
  - id: MDD-3.6
    requirement: data-model#3.6
    level: core
    targets:
      - server
    title: A zero or negative amount is refused with invalid-field
  - id: MDD-4.1
    requirement: data-model#4.1
    level: core
    targets:
      - server
    title: A currency other than HTG is refused with invalid-field
  - id: IDEM-1.3
    requirement: idempotency#1.3
    level: core
    targets:
      - server
    title: A creation without Idempotency-Key is refused without being executed
  - id: IDEM-3.2
    requirement: idempotency#3.2
    level: core
    targets:
      - server
    title: A replay returns the recorded status and body with Idempotent-Replay and no second execution
  - id: IDEM-3.3
    requirement: idempotency#3.3
    level: core
    targets:
      - server
    title: The same key with another body is refused with idempotency-key-reused
  - id: IDEM-6.2
    requirement: idempotency#6.2
    level: core
    targets:
      - server
    title: A reference already used is refused with reference-conflict under another key
  - id: CAP-2.2
    requirement: capabilities#2.2
    level: core
    targets:
      - server
    title: No reserved capability name is announced
  - id: CAP-3.1
    requirement: capabilities#3.1
    level: core
    targets:
      - server
    title: The configuration document is served without authentication
  - id: CAP-3.2
    requirement: capabilities#3.2
    level: core
    targets:
      - server
    title: The capabilities are authenticated and describe each provider
  - id: CAP-3.2.5
    requirement: capabilities#3.2.5
    level: webhooks.emit
    targets:
      - server
    title: webhooks.emit is listed for each provider the server emits events for
  - id: CAP-5.2
    requirement: capabilities#5.2
    level: payments.lookup
    targets:
      - server
    title: With payments.lookup, reading a pending payment establishes the state at the provider
  - id: AUTH-7.3
    requirement: authentication#7.3
    level: core
    targets:
      - server
    title: A revoked key is refused as unauthenticated, indistinguishable from a missing key
  - id: AUTH-7.6
    requirement: authentication#7.6
    level: core
    targets:
      - server
    title: An expired key is refused as unauthenticated, indistinguishable from a missing key
  - id: API-1.9
    requirement: payments-api#1.9
    level: core
    targets:
      - server
    title: An unknown member nested in a request object is refused
  - id: API-10.1.3
    requirement: payments-api#10.1.3
    level: core
    targets:
      - server
    title: Every problem carries its mandatory members with the catalogue values
  - id: API-10.1.6
    requirement: payments-api#10.1.6
    level: core
    targets:
      - server
    title: Errors of the server, 5xx included, carry request_id
  - id: API-10.8.6
    requirement: payments-api#10.8.6
    level: core
    targets:
      - server
    title: A provider error gives provider-error, retryable with effect unknown, never replayed
  - id: MDD-2.1
    requirement: data-model#2.1
    level: core
    targets:
      - server
    title: Request and response bodies are UTF-8 JSON
  - id: MDD-3.2
    requirement: data-model#3.2
    level: core
    targets:
      - server
    title: An amount is an integer number of centimes
  - id: MDD-7.1
    requirement: data-model#7.1
    level: core
    targets:
      - server
    title: Timestamps are RFC 3339 date-times in UTC with an uppercase Z
  - id: CDV-2.1
    requirement: lifecycle#2.1
    level: core
    targets:
      - server
    title: The transitions from pending are reachable
  - id: CDV-4
    requirement: lifecycle#4
    level: core
    targets:
      - server
    title: A payment expired at the provider is expired with completed_at on read
  - id: CDV-6.1
    requirement: lifecycle#6.1
    level: core
    targets:
      - server
    title: The API cannot set the state of a payment
  - id: CDV-7.2
    requirement: lifecycle#7.2
    level: core
    targets:
      - server
    title: A failed payment carries a failure_reason from the closed list matching the provider refusal
  - id: CDV-7.4
    requirement: lifecycle#7.4
    level: core
    targets:
      - server
    title: failure_detail carries the provider code and message unaltered
  - id: CDV-10.2.1
    requirement: lifecycle#10.2.1
    level: payments.statement
    targets:
      - server
    title: A successful payment is an entry of the statement of its business day, with its id and its reference
  - id: CDV-10.2.3
    requirement: lifecycle#10.2.3
    level: payments.statement
    targets:
      - server
    title: A payment that did not succeed is not in the statement
  - id: CDV-10.2.4
    requirement: lifecycle#10.2.4
    level: payments.statement
    targets:
      - server
    title: A statement entry carries the fee its provider reported for the payment and none when the fee is unknown
  - id: CDV-10.3.2
    requirement: lifecycle#10.3.2
    level: payments.statement
    targets:
      - server
    title: A statement is read for a business day or a range with both ends included, and a request without a valid period is refused
  - id: CDV-10.3.3
    requirement: lifecycle#10.3.3
    level: payments.statement
    targets:
      - server
    title: A range above 31 business days is refused with invalid-field
  - id: CDV-10.3.6
    requirement: lifecycle#10.3.6
    level: core
    targets:
      - server
    title: Without payments.statement, the statement is served as an empty collection
  - id: IDEM-2.3
    requirement: idempotency#2.3
    level: core
    targets:
      - server
    title: A recorded response is never served to another principal
  - id: IDEM-3.4
    requirement: idempotency#3.4
    level: core
    targets:
      - server
    title: A concurrent duplicate is never executed in parallel
  - id: CAP-5.3
    requirement: capabilities#5.3
    level: core
    targets:
      - server
    title: Without payments.lookup, reading a pending payment returns the state known to the server
  - id: CAP-6.7
    requirement: capabilities#6.7
    level: core
    targets:
      - server
    title: Declared amount bounds are enforced without creating a payment
  - id: CAP-6.7.1
    requirement: capabilities#6.7.1
    level: core
    targets:
      - server
    title: A zero amount is refused with invalid-field before the declared bounds are checked
  - id: MDD-8.1
    requirement: data-model#8.1
    level: payments.fee
    targets:
      - server
    title: A reported fee carries an amount in HTG and a bearer, merchant or payer
  - id: MDD-8.3
    requirement: data-model#8.3
    level: core
    targets:
      - server
    title: A client cannot set the fee or its bearer at creation
  - id: WH-1.4
    requirement: webhooks#1.4
    level: webhooks.emit
    targets:
      - server
    title: No event is emitted for a state the payment has not reached
  - id: WH-2.1
    requirement: webhooks#2.1
    level: webhooks.emit
    targets:
      - server
    title: Each delivery is one event object with its mandatory members and a full payment snapshot
  - id: WH-3.2
    requirement: webhooks#3.2
    level: webhooks.emit
    targets:
      - server
    title: Each transition emits its registered type with previous_status
  - id: WH-3.4
    requirement: webhooks#3.4
    level: webhooks.emit
    targets:
      - server
    title: A provider report or a read that changes no state emits no event
  - id: WH-4.2
    requirement: webhooks#4.2
    level: webhooks.emit
    targets:
      - server
    title: A delivery is a JSON POST carrying Content-Digest, the event id and type and the attempt rank
  - id: WH-4.4
    requirement: webhooks#4.4
    level: webhooks.emit
    targets:
      - server
    title: A 410 Gone stops the retries of the event
  - id: WH-4.5
    requirement: webhooks#4.5
    level: webhooks.emit
    targets:
      - server
    title: A response slower than 10 seconds is a failure and the delivery is retried
  - id: WH-4.6
    requirement: webhooks#4.6
    level: webhooks.emit
    targets:
      - server
    title: A redirection is a failure, not followed, and the delivery is retried
  - id: WH-4.7
    requirement: webhooks#4.7
    level: webhooks.emit
    targets:
      - server
    title: A failed delivery is retried no sooner than the schedule with the same event id and a byte-identical body
  - id: WH-4.8
    requirement: webhooks#4.8
    level: webhooks.emit
    targets:
      - server
    title: The failing deliveries of one payment do not hold back those of another
  - id: WH-5.3
    requirement: webhooks#5.3
    level: webhooks.emit
    targets:
      - server
    title: Each delivery is signed over the listed components with the mandatory parameters and verifies with a published key
  - id: WH-6.1
    requirement: webhooks#6.1
    level: webhooks.emit
    targets:
      - server
    title: The verification keys are published as JWK in webhook_keys of the unauthenticated configuration document only
  - id: WH-8.1
    requirement: webhooks#8.1
    level: webhooks.emit
    targets:
      - server
    title: The events of a payment carry sequence 1, 2 in order, never reused
  - id: API-5.1.8
    requirement: payments-api#5.1.8
    level: webhooks.per_payment_url
    targets:
      - server
    title: The events of a payment are delivered to its callback_url signed per the webhooks, and a plain http callback_url is refused
