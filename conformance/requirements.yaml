  - id: CDV-6.6
    requirement: cycle-de-vie.md#6.6
    level: webhooks.per_payment_url
    target: gateway
    title: A callback with a wrong per-payment token is rejected without effect
  - id: CDV-6.8
    requirement: cycle-de-vie.md#6.8
    level: core
    target: gateway
    title: The API cannot set the state of a payment
  - id: CDV-7.2
    requirement: cycle-de-vie.md#7.2
    level: core
    target: gateway
    title: A failed payment carries a failure_reason from the closed list matching the operator refusal
  - id: CDV-7.4
    requirement: cycle-de-vie.md#7.4
    level: core
    target: gateway
