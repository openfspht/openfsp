openapi: 3.1.0
info:
  title: OpenFSP API
  version: 0.1.0
  summary: Payment contract between a merchant application and an OpenFSP server.
  description: HTTP contract of the OpenFSP specification. Rule citations such as payments-api#5.1 point to https://openfsp.org/docs/spec.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
externalDocs:
  description: OpenFSP specification
  url: https://openfsp.org/docs/spec
servers:
  - url: "{issuer}"
    description: The server issuer read from its configuration document (capabilities#3.1.3).
    variables:
      issuer:
        default: https://api.example
tags:
  - name: Discovery
    description: Configuration document and per-provider capabilities (capabilities#3).
  - name: Conformance
    description: Preparation and control interface of a conformance run, required in the test environment and absent elsewhere (conformance#4.8, conformance#4.9).
  - name: Payments
    description: Create and read payments (payments-api#5).
  - name: Statements
    description: Successful transactions of a provider for a period (lifecycle#10).
  - name: Webhooks
    description: Signed events delivered to subscriber endpoints (webhooks#4).
security:
  - bearer: []
paths:
  /.well-known/openfsp-configuration:
    get:
      operationId: getConfiguration
      tags: [Discovery]
      summary: Read the configuration document
      description: Unauthenticated discovery document carrying endpoints and webhook keys (capabilities#3.1).
      security: []
      responses:
        "200":
          description: Configuration document.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Configuration"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /:
    servers:
      - url: "{conformance_endpoint}"
        description: The conformance_endpoint the configuration document announces; the specification leaves its URL to the server (conformance#4.8.1).
        variables:
          conformance_endpoint:
            default: https://api.example/conformance
    post:
      operationId: prepareConformance
      tags: [Conformance]
      summary: Prepare a conformance run
      description: Endpoint of the test environment, served at the URL the configuration document announces as conformance_endpoint, that issues short-lived test credentials and the control interface of the run to the conformance suite (conformance#4.8, conformance#4.9.1).
      security:
        - {}
        - bearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConformanceRequest"
      responses:
        "201":
          description: Test credentials, suite inputs and control interface, valid until expires_at.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConformanceFixtures"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /references/{reference}/scenario:
    servers:
      - url: "{control_endpoint}"
        description: The control_endpoint of the preparation response, of the same origin as the issuer (conformance#4.9.1).
        variables:
          control_endpoint:
            default: https://api.example/conformance/control
    parameters:
      - $ref: "#/components/parameters/ControlReference"
    put:
      operationId: setControlScenario
      tags: [Conformance]
      summary: Set the scenario of a reference
      description: Sets the scenario of the next payment created with this reference. Served under the control_endpoint of the preparation response and authenticated with its api_key (conformance#4.9.2).
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlScenario"
      responses:
        "204":
          description: Scenario set.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ControlForbidden"
        "422":
          description: Unknown scenario, or one the implementation cannot produce for the payment service concerned (conformance#4.9.6).
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"
  /references/{reference}:
    servers:
      - url: "{control_endpoint}"
        description: The control_endpoint of the preparation response, of the same origin as the issuer (conformance#4.9.1).
        variables:
          control_endpoint:
            default: https://api.example/conformance/control
    parameters:
      - $ref: "#/components/parameters/ControlReference"
    get:
      operationId: getControlledPayment
      tags: [Conformance]
      summary: Read the state of the payment of a reference
      description: Returns the payment created with this reference, whether it reached its outcome and the number of events sent for it (conformance#4.9.2).
      security:
        - bearer: []
      responses:
        "200":
          description: State of the payment.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlledPayment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ControlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /payments/{id}/resolve:
    servers:
      - url: "{control_endpoint}"
        description: The control_endpoint of the preparation response, of the same origin as the issuer (conformance#4.9.1).
        variables:
          control_endpoint:
            default: https://api.example/conformance/control
    parameters:
      - $ref: "#/components/parameters/PaymentId"
    post:
      operationId: resolveControlledPayment
      tags: [Conformance]
      summary: Give its outcome to a pending payment
      description: Gives its outcome to a pending payment, with a reason on failure (conformance#4.9.2).
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlResolution"
      responses:
        "204":
          description: Outcome given.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ControlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "500":
          $ref: "#/components/responses/InternalError"
  /payments/{id}/callback:
    servers:
      - url: "{control_endpoint}"
        description: The control_endpoint of the preparation response, of the same origin as the issuer (conformance#4.9.1).
        variables:
          control_endpoint:
            default: https://api.example/conformance/control
    parameters:
      - $ref: "#/components/parameters/PaymentId"
    post:
      operationId: triggerControlledCallback
      tags: [Conformance]
      summary: Trigger the held event of a payment
      description: Triggers the held event of this payment (conformance#4.9.2).
      security:
        - bearer: []
      responses:
        "204":
          description: Event triggered.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ControlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/capabilities:
    get:
      operationId: getCapabilities
      tags: [Discovery]
      summary: Read provider capabilities
      description: Capabilities, payment options and limits announced per provider (capabilities#3.2).
      security:
        - bearer: [capabilities:read]
      responses:
        "200":
          description: Capabilities of every configured provider.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/payments:
    post:
      operationId: createPayment
      tags: [Payments]
      summary: Create a payment
      description: Creates a pending payment at the chosen provider, idempotent by key (payments-api#5.1).
      security:
        - bearer: [payments:write]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequest"
      responses:
        "201":
          description: Payment created, or the stored response replayed (idempotency#3.2).
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestId"
            Location:
              $ref: "#/components/headers/Location"
            Idempotent-Replay:
              $ref: "#/components/headers/IdempotentReplay"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          description: "malformed-request, unknown-field, missing-field or idempotency-key-required (payments-api#10.8.1)."
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestId"
            Idempotent-Replay:
              $ref: "#/components/headers/IdempotentReplay"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "reference-conflict or idempotency-request-in-progress (payments-api#10.8.4)."
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestId"
            Idempotent-Replay:
              $ref: "#/components/headers/IdempotentReplay"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "invalid-field, amount-out-of-range, idempotency-key-reused, or capability-not-supported for an operation or a member such as callback_url whose capability the provider does not advertise (payments-api#10.8.1, capabilities#4.4)."
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestId"
            Idempotent-Replay:
              $ref: "#/components/headers/IdempotentReplay"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/ProviderError"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
        "504":
          $ref: "#/components/responses/ProviderTimeout"
    get:
      operationId: findPaymentByReference
      tags: [Payments]
      summary: Find a payment by reference
      description: Collection of at most one payment, empty for an unknown reference (payments-api#5.2.2).
      security:
        - bearer: [payments:read]
      parameters:
        - name: reference
          in: query
          required: true
          description: Merchant reference of the payment.
          schema:
            $ref: "../conformance/schemas/common.json#/$defs/reference"
      responses:
        "200":
          description: Matching payment, if any.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/payments/{id}:
    parameters:
      - $ref: "#/components/parameters/PaymentId"
    get:
      operationId: getPayment
      tags: [Payments]
      summary: Read a payment
      description: Returns the most recent state the server can establish (payments-api#5.2.4).
      security:
        - bearer: [payments:read]
      responses:
        "200":
          description: The payment.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/statements:
    get:
      operationId: listStatementEntries
      tags: [Statements]
      summary: Read the statement of a provider
      description: Successful transactions of a provider for one business day or a range of at most 31 business days, sorted by ascending booked_at and paginated by cursor (lifecycle#10.3).
      security:
        - bearer: [statements:read]
      parameters:
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/BusinessDate"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of entries, empty for a period without transactions (lifecycle#10.3.4).
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementCollection"
        "400":
          description: "missing-field: the provider or the period is absent (lifecycle#10.3.2)."
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: "invalid-field: business_date combined with from or to, a single end of a range, an invalid date, to before from, a range above 31 business days, or an invalid limit or cursor (lifecycle#10.3.2, lifecycle#10.3.3); capability-not-supported for a provider that does not advertise payments.statement (capabilities#4.4)."
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
webhooks:
  paymentEvent:
    post:
      operationId: receivePaymentEvent
      tags: [Webhooks]
      summary: Receive a payment event
      description: Signed delivery of one payment event, to verify before acting (webhooks#5.9).
      security: []
      parameters:
        - name: Signature-Input
          in: header
          required: true
          description: RFC 9421 signature parameters, tag openfsp-webhook (webhooks#5.3).
          schema:
            type: string
        - name: Signature
          in: header
          required: true
          description: RFC 9421 signature (webhooks#5.1).
          schema:
            type: string
        - name: Content-Digest
          in: header
          required: true
          description: RFC 9530 sha-256 digest of the body (webhooks#5.5).
          schema:
            type: string
        - name: OpenFSP-Event-Id
          in: header
          required: true
          description: Event id, covered by the signature (webhooks#4.2).
          schema:
            $ref: "../conformance/schemas/common.json#/$defs/resource_id"
        - name: OpenFSP-Event-Type
          in: header
          required: true
          description: Event type, covered by the signature (webhooks#4.2).
          schema:
            type: string
        - name: OpenFSP-Delivery-Attempt
          in: header
          required: true
          description: Attempt number from 1, not covered by the signature (webhooks#4.2).
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentEvent"
      responses:
        "200":
          description: Delivery accepted. Any 2xx status succeeds (webhooks#4.3).
        "400":
          description: Signature verification failed (webhooks#5.12).
        "410":
          description: Endpoint gone, the server stops retrying the event (webhooks#4.4).
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: API key of the form ofsp_<env>_<secret> (authentication#2.1). Requirements list the scope each operation needs.
  schemas:
    Configuration:
      $ref: "../conformance/schemas/discovery.json"
    Capabilities:
      $ref: "../conformance/schemas/capabilities.json"
    ConformanceRequest:
      type: object
      properties:
        webhook_url:
          type: string
          format: uri
          description: Receiver of the suite, to which the server delivers payment events until expires_at.
    ConformanceFixtures:
      $ref: "../conformance/schemas/fixtures.json"
    ControlScenario:
      type: object
      required: [scenario]
      properties:
        scenario:
          type: string
          description: Scenario of conformance#4.9.3.
          enum: [SUCCESS, DECLINE, INSUFFICIENT, TIMEOUT, PENDING_FOREVER, EXPIRE, NO_CALLBACK, LATE_CALLBACK, DUPLICATE_CALLBACK, UNKNOWN_STATUS, PROVIDER_ERROR]
    ControlledPayment:
      type: object
      required: [payment, settled, callbacks_sent]
      properties:
        payment:
          $ref: "../conformance/schemas/common.json#/$defs/resource_id"
        settled:
          type: boolean
          description: Whether the payment reached its outcome.
        callbacks_sent:
          type: integer
          minimum: 0
          description: Number of events sent for the payment.
    ControlResolution:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [succeeded, failed, expired]
        reason:
          type: string
          description: Failure reason of lifecycle#7.2, when the outcome is failed.
    PaymentRequest:
      $ref: "../conformance/schemas/payment-request.json"
    Payment:
      $ref: "../conformance/schemas/payment.json"
    PaymentCollection:
      $ref: "../conformance/schemas/payment-collection.json"
    PaymentEvent:
      $ref: "../conformance/schemas/event.json"
    Problem:
      $ref: "../conformance/schemas/problem.json"
    StatementEntry:
      $ref: "../conformance/schemas/statement.json#/$defs/entry"
    StatementCollection:
      $ref: "../conformance/schemas/statement.json"
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: One key per logical operation, reused on every resend (idempotency#7.1).
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,255}$"
    ControlReference:
      name: reference
      in: path
      required: true
      description: Merchant reference of the payment.
      schema:
        $ref: "../conformance/schemas/common.json#/$defs/reference"
    PaymentId:
      name: id
      in: path
      required: true
      description: Payment id.
      schema:
        $ref: "../conformance/schemas/common.json#/$defs/resource_id"
    Provider:
      name: provider
      in: query
      required: true
      description: Registered provider identifier.
      schema:
        $ref: "../conformance/schemas/common.json#/$defs/provider_id"
    BusinessDate:
      name: business_date
      in: query
      required: false
      description: Business day as an RFC 3339 full-date (lifecycle#10.1). Either business_date, or from and to.
      schema:
        $ref: "../conformance/schemas/common.json#/$defs/date"
    From:
      name: from
      in: query
      required: false
      description: First business day of a range, included (lifecycle#10.3.2).
      schema:
        $ref: "../conformance/schemas/common.json#/$defs/date"
    To:
      name: to
      in: query
      required: false
      description: Last business day of a range, included (lifecycle#10.3.2).
      schema:
        $ref: "../conformance/schemas/common.json#/$defs/date"
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of entries in the page (lifecycle#10.3.4).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque next_cursor of the previous page (lifecycle#10.3.4).
      schema:
        type: string
  headers:
    RequestId:
      description: Equal to the request_id of a problem, present on every response (payments-api#1.8).
      required: true
      schema:
        type: string
        minLength: 1
    Location:
      description: Path of the created payment (payments-api#5.1).
      required: true
      schema:
        type: string
    IdempotentReplay:
      description: true when the response is a stored one replayed (idempotency#3.2).
      schema:
        const: "true"
    RetryAfter:
      description: Seconds to wait before resending (payments-api#10.5.5).
      schema:
        type: integer
        minimum: 0
    RetryAfterRequired:
      description: Seconds to wait before resending (payments-api#10.8.5).
      required: true
      schema:
        type: integer
        minimum: 0
    CacheControl:
      description: Caching directives (capabilities#3.2.4).
      schema:
        type: string
    WwwAuthenticate:
      description: Bearer challenge (authentication#3.3).
      schema:
        type: string
  responses:
    BadRequest:
      description: "malformed-request, unknown-field or missing-field (payments-api#10.8.1)."
      headers:
        Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthenticated:
      description: "unauthenticated: credential absent, malformed or invalid (payments-api#10.8.2)."
      headers:
        Request-Id:
          $ref: "#/components/headers/RequestId"
        WWW-Authenticate:
          $ref: "#/components/headers/WwwAuthenticate"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: "forbidden: the key lacks the required scope (authentication#6.4)."
      headers:
        Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: "not-found (payments-api#10.8.3)."
      headers:
        Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableContent:
      description: "invalid-field or capability-not-supported (payments-api#10.8.1)."
      headers:
        Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: "rate-limited (payments-api#10.8.5)."
      headers:
        Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfterRequired"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ControlForbidden:
      description: "forbidden: the key is not the api_key of a conformance preparation in progress (conformance#4.9.2)."
      headers:
        Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    StateConflict:
      description: "state-conflict: the payment already has its outcome, or follows no scenario of the run (conformance#4.9.2)."
      headers:
        Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: "internal-error, effect unknown unless no provider call took place (payments-api#10.8.6.2)."
      headers:
        Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ProviderError:
      description: "provider-error, effect unknown (payments-api#10.8.6)."
      headers:
        Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ProviderUnavailable:
      description: "provider-unavailable, no request reached the provider (payments-api#10.8.6.1)."
      headers:
        Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ProviderTimeout:
      description: "provider-timeout, effect unknown (payments-api#5.1.6)."
      headers:
        Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
