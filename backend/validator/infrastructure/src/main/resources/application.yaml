spring:
  application:
    name: validator
  config:
    import: optional:configtree:${OPENFSP_VALIDATOR_SECRETS_DIR:/run/secrets/openfsp-validator/}
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${OPENFSP_VALIDATOR_SCHEMA:openfsp_validator}
  flyway:
    schemas: ${OPENFSP_VALIDATOR_SCHEMA:openfsp_validator}
    default-schema: ${OPENFSP_VALIDATOR_SCHEMA:openfsp_validator}
    create-schemas: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  web:
    error:
      include-stacktrace: never

server:
  port: 8095
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

sentry:
  send-default-pii: false
  tags:
    service: validator
