spring:
  application:
    name: validator
  profiles:
    default: development
  config:
    import: optional:configtree:${OPENFSP_VALIDATOR_SECRETS_DIR:/run/secrets/openfsp-validator/}
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${OPENFSP_VALIDATOR_SCHEMA:openfsp_validator}
  flyway:
    schemas: ${OPENFSP_VALIDATOR_SCHEMA:openfsp_validator}
    default-schema: ${OPENFSP_VALIDATOR_SCHEMA:openfsp_validator}
    create-schemas: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    async:
      request-timeout: 35m

server:
  port: 8095
  shutdown: graceful
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

openfsp:
  validator:
    development-mode: false
    simulator:
      providers:
        mock_openfsp:
          display-name: OpenFSP (mock)
          base-path: /mock_openfsp
          credentials:
            api-key: ofsp_test_MockOpenFspKeyPublishedForTheSimulator
          inputs:
            statements-key: ofsp_test_MockOpenFspKeyPublishedForTheSimulator
            restricted-key: ofsp_test_MockOpenFspSecondPrincipalKeyForTheSimulator
            revoked-key: ofsp_test_MockOpenFspRevokedKeyPublishedForTheSimulator
            expired-key: ofsp_test_MockOpenFspExpiredKeyPublishedForTheSimulator
        mock_no_source:
          display-name: Base test provider (mock)
          base-path: /mock_no_source
          credentials:
            api-key: ofsp_test_MockNoSourceKeyPublishedForTheSimulator
        mock_statement_only:
          display-name: Statement only (mock)
          base-path: /mock_statement_only
          credentials:
            api-key: ofsp_test_MockStatementOnlyKeyPublishedForTheSimulator
