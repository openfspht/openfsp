spring:
  application:
    name: gateway
  config:
    import: optional:configtree:${OPENFSP_SECRETS_DIR:/run/secrets/openfsp/}
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
      fail-on-null-for-primitives: true
  web:
    error:
      include-stacktrace: never

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

sentry:
  send-default-pii: false
  tags:
    service: gateway

openfsp:
  environment: live
  development-mode: false
  provider-timeout: 10s
