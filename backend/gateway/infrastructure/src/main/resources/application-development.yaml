spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/openfsp
    username: openfsp
    password: openfsp

openfsp:
  environment: test
  development-mode: true
  public-base-url: http://127.0.0.1:8080
  conformance:
    enabled: true
  order-id-derivation-key: ZGV2ZWxvcG1lbnQtb25seS1kZXJpdmF0aW9uLWtleS0wMQ==
  webhooks:
    endpoints:
      demo-shop:
        url: http://127.0.0.1:3000/webhooks/openfsp
        events: [payment.created, payment.succeeded, payment.failed, payment.expired, payment.canceled]
        enabled: true
  providers:
    mock_openfsp:
      type: openfsp
      logo-url: https://cdn.openfsp.org/logo/openfsp-logo.svg
      base-url: http://127.0.0.1:8090/mock_openfsp
      api-key: ofsp_test_MockOpenFspKeyPublishedForTheSimulator
    mock_moncash:
      type: moncash
      display-name: MonCash (mock)
      logo-url: https://digicelmoncash.com/qrcode/images/logo.png
      base-url: http://127.0.0.1:8090/mock_moncash/Api
      secondary-url: http://127.0.0.1:8090/mock_moncash/Moncash-middleware
      credentials:
        client-id: mock_moncash_client_id
        client-secret: mock_moncash_client_secret
    mock_natcash:
      type: natcash
      display-name: NatCash (mock)
      logo-url: https://testmerchantpay.natcom.com.ht/merchant/_next/static/images/logo-1689408a84fe0c46831e7ae2d19fe04c.png
      base-url: http://127.0.0.1:8090/mock_natcash/api/online-payment
      limits:
        min-amount: 1000
        max-amount: 10000000
        amount-step: 100
      credentials:
        username: mock_natcash_user
        password: mock_natcash_password
        partner-code: MOCKNATCASH
        private-key: mock_natcash_private_key
        function-code: mock_natcash_function_code
