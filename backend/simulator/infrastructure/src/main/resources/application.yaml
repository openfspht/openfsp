spring:
  application:
    name: simulator
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: 8090
  address: 127.0.0.1

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

sentry:
  send-default-pii: false
  tags:
    service: simulator

openfsp:
  simulator:
    public-base-url: ${simulator.public-base-url:http://127.0.0.1:8090}
    response-delay: ${simulator.response-delay:200ms}
    settle-after: ${simulator.settle-after:2s}
    hang-duration: ${simulator.hang-duration:40s}
    late-callback-delay: ${simulator.late-callback-delay:2m}
    callbacks:
      private-addresses-allowed: true
    operators:
      mock_openfsp:
        dialect: openfsp
        display-name: OpenFSP (mock)
        reference-prefix: MO
        lookup: true
        callbacks: true
        idempotent-by-reference: true
        statements: true
        emits-events: true
        limits:
          min-amount: 1000
          max-amount: 10000000
          amount-step: 100
        fee:
          rate-basis-points: 200
          bearer: merchant
        return-url: http://127.0.0.1:8080/return/mock_openfsp
        credentials:
          api-key: ofsp_test_MockOpenFspKeyPublishedForTheSimulator
          second-principal-api-key: ofsp_test_MockOpenFspSecondPrincipalKeyForTheSimulator
          revoked-api-key: ofsp_test_MockOpenFspRevokedKeyPublishedForTheSimulator
          expired-api-key: ofsp_test_MockOpenFspExpiredKeyPublishedForTheSimulator
      mock_moncash:
        dialect: moncash
        reference-prefix: MC
        lookup: true
        callbacks: false
        idempotent-by-reference: false
        return-url: http://127.0.0.1:8080/return/mock_moncash
        webhook-url: http://127.0.0.1:8080/callbacks/mock_moncash
        credentials:
          client-id: mock_moncash_client_id
          client-secret: mock_moncash_client_secret
      mock_natcash:
        dialect: natcash
        reference-prefix: MN
        lookup: true
        callbacks: true
        idempotent-by-reference: false
        return-url: http://127.0.0.1:8080/return/mock_natcash
        credentials:
          username: mock_natcash_user
          password: mock_natcash_password
          partner-code: MOCKNATCASH
          private-key: mock_natcash_private_key
          function-code: mock_natcash_function_code
