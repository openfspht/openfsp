spring:
  docker:
    compose:
      enabled: true
      file: ../../compose.yaml

openfsp:
  environment: test
  development-mode: true
  public-base-url: http://127.0.0.1:8080
  order-id-derivation-key: ZGV2ZWxvcG1lbnQtb25seS1kZXJpdmF0aW9uLWtleS0wMQ==
  webhooks:
    endpoints:
      demo-shop:
        url: http://127.0.0.1:3000/webhooks/openfsp
        events: [payment.created, payment.succeeded, payment.failed, payment.expired, payment.canceled]
        enabled: true
  providers:
    mock_alpha:
      base-url: http://127.0.0.1:8090/mock_alpha/v1
      api-key: mock_alpha_test_key
      callback-secret: mock_alpha_callback_secret
    mock_beta:
      base-url: http://127.0.0.1:8090/mock_beta/v1
      api-key: mock_beta_test_key
    mock_epsilon:
      base-url: http://127.0.0.1:8090/mock_epsilon/v1
      api-key: mock_epsilon_test_key
