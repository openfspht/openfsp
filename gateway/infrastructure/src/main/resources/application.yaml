spring:
  application:
    name: gateway
  profiles:
    default: development
  config:
    import: optional:configtree:${OPENFSP_SECRETS_DIR:/run/secrets/openfsp/}
  docker:
    compose:
      enabled: false
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
      fail-on-null-for-primitives: true

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

openfsp:
  environment: live
  development-mode: false
  provider-timeout: 10s
