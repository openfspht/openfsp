spring:
  application:
    name: simulator
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: 8090
  address: 127.0.0.1

simulator:
  response-delay: 200ms
  settle-after: 2s
  hang-duration: 40s
  late-callback-delay: 2m
  alpha:
    api-key: mock_alpha_test_key
    callback-secret: mock_alpha_callback_secret
