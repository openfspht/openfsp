spring:
  application:
    name: simulator
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: 8090
  address: 127.0.0.1

simulator:
  response-delay: 200ms
  settle-after: 2s
  hang-duration: 40s
  late-callback-delay: 2m
  operators:
    mock_alpha:
      reference-prefix: MA
      api-key: mock_alpha_test_key
      callback-secret: mock_alpha_callback_secret
      lookup: true
      callbacks: true
      idempotent-by-order: true
    mock_beta:
      reference-prefix: MB
      api-key: mock_beta_test_key
      lookup: false
      callbacks: false
      idempotent-by-order: false
    mock_epsilon:
      reference-prefix: ME
      api-key: mock_epsilon_test_key
      lookup: false
      callbacks: true
      idempotent-by-order: false
      statements: true
      return-url: http://127.0.0.1:8080/return/mock_epsilon
